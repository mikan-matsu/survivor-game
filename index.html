<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Survivor Game</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #2f5d3a;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const FONT = "system-ui, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif";
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, dpr = 1, vignette = null;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    const r = Math.hypot(W, H) / 2;
    vignette = ctx.createRadialGradient(W / 2, H / 2, r * 0.45, W / 2, H / 2, r);
    vignette.addColorStop(0, 'rgba(4,18,10,0)');
    vignette.addColorStop(1, 'rgba(4,18,10,0.55)');
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  // =====================================================================
  // Drawing helpers
  // =====================================================================
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // deterministic hash -> [0,1)
  function hash(x, y, s) {
    let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  // pre-render a sprite at 2x resolution; draw with logical size w x h
  function mk(w, h, fn) {
    const c = document.createElement('canvas');
    c.width = w * 2; c.height = h * 2;
    const g = c.getContext('2d');
    g.scale(2, 2);
    fn(g);
    return c;
  }
  function silhouette(src) {
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    const g = c.getContext('2d');
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = '#fff';
    g.fillRect(0, 0, c.width, c.height);
    return c;
  }
  function lg(g, x0, y0, x1, y1, stops) {
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    for (const s of stops) gr.addColorStop(s[0], s[1]);
    return gr;
  }
  function rg(g, x0, y0, r0, x1, y1, r1, stops) {
    const gr = g.createRadialGradient(x0, y0, r0, x1, y1, r1);
    for (const s of stops) gr.addColorStop(s[0], s[1]);
    return gr;
  }
  function ell(g, x, y, rx, ry, fill, stroke, lw, rot) {
    g.beginPath();
    g.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
    if (fill) { g.fillStyle = fill; g.fill(); }
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1.5; g.stroke(); }
  }
  function poly(g, pts, fill, stroke, lw) {
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.closePath();
    if (fill) { g.fillStyle = fill; g.fill(); }
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1.5; g.lineJoin = 'round'; g.stroke(); }
  }
  function rrect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  // =====================================================================
  // Ground tiles (seamless, pre-rendered)
  // =====================================================================
  const TILE = 128;
  function wraps(x, y, m) {
    const xs = [0], ys = [0];
    if (x < m) xs.push(TILE); else if (x > TILE - m) xs.push(-TILE);
    if (y < m) ys.push(TILE); else if (y > TILE - m) ys.push(-TILE);
    const out = [];
    for (const a of xs) for (const b of ys) out.push([a, b]);
    return out;
  }
  function makeTile(seed) {
    return mk(TILE, TILE, g => {
      const R = rng(seed);
      g.fillStyle = '#3d7841';
      g.fillRect(0, 0, TILE, TILE);
      // soft light / shade blobs
      for (let i = 0; i < 9; i++) {
        const x = R() * TILE, y = R() * TILE, r = 22 + R() * 30;
        const light = R() < 0.5;
        const c = light ? '120,195,105' : '14,48,28';
        const a = light ? 0.07 : 0.09;
        for (const [ox, oy] of wraps(x, y, r)) {
          g.fillStyle = rg(g, x + ox, y + oy, 0, x + ox, y + oy, r,
            [[0, `rgba(${c},${a})`], [1, `rgba(${c},0)`]]);
          g.fillRect(x + ox - r, y + oy - r, r * 2, r * 2);
        }
      }
      // grass blades
      const cols = ['#2c6535', '#47904f', '#5aa85c', '#2a5e33', '#6bb766'];
      g.lineCap = 'round';
      for (let i = 0; i < 150; i++) {
        const x = R() * TILE, y = R() * TILE;
        const h = 4 + R() * 7, lean = (R() - 0.5) * 5;
        g.strokeStyle = cols[Math.floor(R() * cols.length)];
        g.lineWidth = 1 + R() * 0.7;
        for (const [ox, oy] of wraps(x, y, 10)) {
          g.beginPath();
          g.moveTo(x + ox, y + oy);
          g.quadraticCurveTo(x + ox + lean * 0.3, y + oy - h * 0.6, x + ox + lean, y + oy - h);
          g.stroke();
        }
      }
      // pebbles and dirt specks
      for (let i = 0; i < 5; i++) {
        const x = R() * TILE, y = R() * TILE;
        for (const [ox, oy] of wraps(x, y, 4)) {
          ell(g, x + ox, y + oy, 1.6 + R(), 1, R() < 0.5 ? 'rgba(90,70,40,0.5)' : 'rgba(160,165,150,0.5)');
        }
      }
    });
  }
  const tiles = [];
  for (let i = 0; i < 6; i++) tiles.push(makeTile(1000 + i * 77));

  // =====================================================================
  // Decor sprites (trees, bushes, rocks...)
  // =====================================================================
  function drawTree(g, variant, seed) {
    const R = rng(seed);
    // trunk
    g.beginPath();
    g.moveTo(48, 156); g.quadraticCurveTo(58, 150, 58, 128);
    g.lineTo(58, 96); g.lineTo(70, 96); g.lineTo(70, 128);
    g.quadraticCurveTo(70, 150, 80, 156); g.closePath();
    g.fillStyle = lg(g, 52, 0, 78, 0, [[0, '#7a5230'], [0.55, '#5a3a22'], [1, '#33200f']]);
    g.fill();
    g.strokeStyle = '#2a190b'; g.lineWidth = 1.5; g.stroke();
    g.strokeStyle = 'rgba(30,18,8,0.5)'; g.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const y = 104 + i * 11;
      g.beginPath(); g.moveTo(61, y); g.lineTo(62, y + 7); g.stroke();
    }
    if (variant === 3) { // pine
      const tiers = [[60, 128, 34], [50, 106, 28], [40, 84, 23], [30, 62, 17]];
      tiers.forEach(([w, y, h], i) => {
        const dark = ['#1d4a2e', '#235a35', '#2a6a3d', '#337a46'][i];
        const light = ['#2d6b42', '#378048', '#43955a', '#58ad6c'][i];
        poly(g, [[64, y - h], [64 + w / 2, y], [64 - w / 2, y]],
          lg(g, 64 - w / 2, 0, 64 + w / 2, 0, [[0, light], [0.5, dark], [1, '#143a24']]), '#10301d', 1.4);
        g.strokeStyle = 'rgba(160,230,170,0.25)'; g.lineWidth = 1;
        g.beginPath(); g.moveTo(64 - 3, y - h + 10); g.lineTo(64 - w / 2 + 8, y - 2); g.stroke();
      });
      return;
    }
    const pal = variant === 2
      ? [['#8a3a14', '#c4621f'], ['#c4621f', '#e8923a'], ['#f2b455', '#ffe0a0']]
      : [['#1c4f29', '#2f7d3b'], ['#2f7d3b', '#4fa653'], ['#6cc46a', '#b2ee8f']];
    const blobs = [];
    for (let i = 0; i < 9; i++) {
      const a = R() * TAU, d = R() * 26;
      blobs.push([64 + Math.cos(a) * d, 70 + Math.sin(a) * d * 0.8, 20 + R() * 12]);
    }
    blobs.push([64, 44, 22]);
    for (let L = 0; L < 3; L++) {
      for (const [bx, by, br] of blobs) {
        const x = bx - L * 3, y = by - L * 4, r = br - L * 4.5;
        g.fillStyle = rg(g, x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r, [[0, pal[L][1]], [1, pal[L][0]]]);
        g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
        if (L === 0) { g.strokeStyle = 'rgba(8,30,14,0.45)'; g.lineWidth = 1.2; g.stroke(); }
      }
    }
    for (let i = 0; i < 70; i++) {
      const a = R() * TAU, d = Math.sqrt(R()) * 40;
      const x = 64 + Math.cos(a) * d - 4, y = 64 + Math.sin(a) * d * 0.75 - 6;
      ell(g, x, y, 2.2, 1.3, R() < 0.5 ? pal[2][1] : pal[1][1], null, 0, R() * 3);
    }
  }
  function drawBush(g, v) {
    const pal = [['#1f5a2c', '#38893f'], ['#2f7d3b', '#58b05a'], ['#6cc46a', '#b2ee8f']];
    const blobs = [[20, 28, 15], [34, 22, 18], [47, 29, 14], [30, 32, 14]];
    for (let L = 0; L < 3; L++) {
      for (const [bx, by, br] of blobs) {
        const x = bx - L * 2, y = by - L * 3, r = br - L * 3.5;
        g.fillStyle = rg(g, x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r, [[0, pal[L][1]], [1, pal[L][0]]]);
        g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
        if (L === 0) { g.strokeStyle = 'rgba(8,30,14,0.45)'; g.lineWidth = 1.2; g.stroke(); }
      }
    }
    if (v === 1) {
      for (const [x, y] of [[18, 24], [28, 16], [40, 20], [46, 28], [30, 30], [22, 33]]) {
        ell(g, x, y, 2.6, 2.6, '#d8283a', '#7a1020', 0.8);
        ell(g, x - 0.8, y - 0.9, 0.8, 0.8, 'rgba(255,255,255,0.8)');
      }
    }
  }
  function drawRock(g, v) {
    const base = [[6, 44], [10, 26], [24, 10], [44, 8], [60, 22], [66, 44]];
    poly(g, base, lg(g, 6, 8, 66, 44, [[0, '#c9ced6'], [0.5, '#838a96'], [1, '#4c525d']]), '#2a2e36', 1.6);
    poly(g, [[10, 26], [24, 10], [44, 8], [38, 22], [20, 28]], 'rgba(255,255,255,0.28)');
    poly(g, [[44, 8], [60, 22], [66, 44], [52, 44], [48, 24]], 'rgba(10,12,20,0.25)');
    g.strokeStyle = 'rgba(30,34,44,0.6)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(30, 26); g.lineTo(36, 36); g.lineTo(32, 44); g.stroke();
    ell(g, 18, 18, 9, 4, 'rgba(90,150,70,0.65)', null, 0, -0.5);
    if (v === 1) {
      poly(g, [[0, 48], [2, 40], [10, 36], [16, 40], [16, 48]], lg(g, 0, 36, 16, 48, [[0, '#aab0b8'], [1, '#5a606c']]), '#2a2e36', 1.2);
    }
  }
  function drawStump(g) {
    g.fillStyle = lg(g, 8, 0, 44, 0, [[0, '#8a5d38'], [0.6, '#5f3d22'], [1, '#3a2312']]);
    g.beginPath(); g.moveTo(8, 18); g.lineTo(8, 32); g.quadraticCurveTo(26, 42, 44, 32); g.lineTo(44, 18); g.closePath(); g.fill();
    g.strokeStyle = '#2a190b'; g.lineWidth = 1.5; g.stroke();
    ell(g, 26, 18, 18, 8, '#c99a62', '#2a190b', 1.5);
    ell(g, 26, 18, 12, 5, null, 'rgba(110,70,35,0.8)', 1);
    ell(g, 26, 18, 6, 2.5, null, 'rgba(110,70,35,0.8)', 1);
  }
  function drawFlowers(g, v) {
    const col = [['#ff8fb8', '#fff0f5'], ['#ffffff', '#ffe36b'], ['#ffd23f', '#fff6c2'], ['#8fb8ff', '#eef4ff']][v % 4];
    g.strokeStyle = '#2f7a3a'; g.lineWidth = 1.4; g.lineCap = 'round';
    const pts = [[8, 18], [16, 12], [26, 16], [34, 10], [41, 18], [21, 21]];
    for (const [x, y] of pts) {
      g.beginPath(); g.moveTo(x, 24); g.quadraticCurveTo(x + 1, (24 + y) / 2, x, y); g.stroke();
    }
    g.fillStyle = '#3f9a4a';
    for (const x of [6, 14, 24, 32, 40]) { ell(g, x, 22, 4, 1.6, '#3f9a4a', null, 0, x % 2 ? 0.5 : -0.5); }
    for (const [x, y] of pts) {
      for (let k = 0; k < 5; k++) {
        const a = k * TAU / 5;
        ell(g, x + Math.cos(a) * 2.4, y + Math.sin(a) * 2.4, 2, 2, col[0], 'rgba(60,30,40,0.35)', 0.5);
      }
      ell(g, x, y, 1.5, 1.5, col[1]);
    }
  }
  function drawMushroom(g, v) {
    const cap = v ? '#9a6a3a' : '#d8283a', hi = v ? '#c99a62' : '#ff6a78';
    g.fillStyle = '#f2ead8'; rrect(g, 11, 14, 6, 11, 2.5); g.fill();
    g.strokeStyle = '#6a5a40'; g.lineWidth = 1; g.stroke();
    g.beginPath(); g.moveTo(3, 15); g.quadraticCurveTo(14, -4, 25, 15); g.quadraticCurveTo(14, 18, 3, 15); g.closePath();
    g.fillStyle = rg(g, 10, 6, 1, 14, 10, 14, [[0, hi], [1, cap]]); g.fill();
    g.strokeStyle = '#4a1018'; g.lineWidth = 1.2; g.stroke();
    if (!v) { ell(g, 9, 9, 2, 1.6, '#fff'); ell(g, 17, 7, 2.2, 1.7, '#fff'); ell(g, 14, 12, 1.5, 1.2, '#fff'); }
  }
  function drawTallGrass(g) {
    const cols = ['#2f7a3a', '#4aa352', '#68c068'];
    g.lineCap = 'round';
    for (let i = 0; i < 16; i++) {
      const x = 6 + i * 2.2, h = 14 + (i * 7 % 11), lean = ((i * 5) % 9) - 4;
      g.strokeStyle = cols[i % 3]; g.lineWidth = 1.8;
      g.beginPath(); g.moveTo(x, 30); g.quadraticCurveTo(x + lean * 0.3, 30 - h * 0.6, x + lean, 30 - h); g.stroke();
    }
  }

  const DEC = [
    { s: mk(128, 168, g => drawTree(g, 0, 11)), w: 128, h: 168, ax: 64, ay: 156, sh: [32, 9, 12] },
    { s: mk(128, 168, g => drawTree(g, 1, 23)), w: 128, h: 168, ax: 64, ay: 156, sh: [32, 9, 12] },
    { s: mk(128, 168, g => drawTree(g, 2, 37)), w: 128, h: 168, ax: 64, ay: 156, sh: [32, 9, 12] },
    { s: mk(128, 168, g => drawTree(g, 3, 5)),  w: 128, h: 168, ax: 64, ay: 156, sh: [26, 8, 10] },
    { s: mk(64, 48, g => drawBush(g, 0)), w: 64, h: 48, ax: 32, ay: 42, sh: [24, 6, 4] },
    { s: mk(64, 48, g => drawBush(g, 1)), w: 64, h: 48, ax: 32, ay: 42, sh: [24, 6, 4] },
    { s: mk(72, 52, g => drawRock(g, 0)), w: 72, h: 52, ax: 36, ay: 46, sh: [28, 7, 6] },
    { s: mk(72, 52, g => drawRock(g, 1)), w: 72, h: 52, ax: 36, ay: 46, sh: [28, 7, 6] },
    { s: mk(52, 44, drawStump), w: 52, h: 44, ax: 26, ay: 38, sh: [20, 6, 6] },
    { s: mk(48, 28, g => drawFlowers(g, 0)), w: 48, h: 28, ax: 24, ay: 24, sh: null },
    { s: mk(48, 28, g => drawFlowers(g, 1)), w: 48, h: 28, ax: 24, ay: 24, sh: null },
    { s: mk(48, 28, g => drawFlowers(g, 2)), w: 48, h: 28, ax: 24, ay: 24, sh: null },
    { s: mk(48, 28, g => drawFlowers(g, 3)), w: 48, h: 28, ax: 24, ay: 24, sh: null },
    { s: mk(28, 28, g => drawMushroom(g, 0)), w: 28, h: 28, ax: 14, ay: 25, sh: [8, 3, 2] },
    { s: mk(28, 28, g => drawMushroom(g, 1)), w: 28, h: 28, ax: 14, ay: 25, sh: [8, 3, 2] },
    { s: mk(44, 34, drawTallGrass), w: 44, h: 34, ax: 22, ay: 30, sh: null },
  ];
  const CELL = 160;
  function decorAt(cx, cy) {
    if (hash(cx, cy, 99) > 0.58) return null;
    const x = (cx + 0.12 + 0.76 * hash(cx, cy, 101)) * CELL;
    const y = (cy + 0.12 + 0.76 * hash(cx, cy, 102)) * CELL;
    if (x * x + y * y < 150 * 150) return null; // clear start area
    const r = hash(cx, cy, 100);
    let k;
    if (r < 0.20) k = Math.floor(hash(cx, cy, 103) * 3);         // round trees
    else if (r < 0.30) k = 3;                                      // pine
    else if (r < 0.42) k = 4 + Math.floor(hash(cx, cy, 103) * 2); // bush
    else if (r < 0.50) k = 6 + Math.floor(hash(cx, cy, 103) * 2); // rock
    else if (r < 0.54) k = 8;                                      // stump
    else if (r < 0.74) k = 9 + Math.floor(hash(cx, cy, 103) * 4); // flowers
    else if (r < 0.82) k = 13 + Math.floor(hash(cx, cy, 103) * 2);// mushroom
    else k = 15;                                                   // tall grass
    return { k, x, y };
  }

  // =====================================================================
  // Player sprite (little wizard "Mikan"), 4 walk frames
  // =====================================================================
  const PW = 64, PH = 84, PAX = 32, PAY = 74;
  function drawWizard(g, step) {
    const legL = [0, 3, 0, -3][step], bob = [0, -1, 0, -1][step];
    const line = '#3a1a0a';
    g.save();
    g.translate(0, 8 + bob);
    // cape (behind)
    g.beginPath();
    g.moveTo(25, 38); g.quadraticCurveTo(10, 50, 13, 68); g.lineTo(30, 66); g.lineTo(30, 38); g.closePath();
    g.fillStyle = lg(g, 12, 40, 28, 68, [[0, '#d9611f'], [1, '#8a3410']]);
    g.fill(); g.strokeStyle = line; g.lineWidth = 1.4; g.stroke();
    // boots
    g.save(); g.translate(0, -bob);
    for (const [x, off] of [[24, legL], [34, -legL]]) {
      const lift = Math.max(0, off) * 0.6;
      rrect(g, x + off * 0.5, 60 - lift, 8, 8, 3);
      g.fillStyle = lg(g, 0, 60, 0, 68, [[0, '#7a4a28'], [1, '#3e2410']]);
      g.fill(); g.strokeStyle = line; g.lineWidth = 1.3; g.stroke();
    }
    g.restore();
    // robe
    g.beginPath();
    g.moveTo(24, 38); g.lineTo(40, 38); g.quadraticCurveTo(46, 52, 46, 62); g.quadraticCurveTo(32, 67, 18, 62); g.quadraticCurveTo(18, 52, 24, 38);
    g.closePath();
    g.fillStyle = lg(g, 20, 38, 44, 64, [[0, '#ffbe5c'], [0.5, '#f08a2a'], [1, '#b84a14']]);
    g.fill(); g.strokeStyle = line; g.lineWidth = 1.5; g.stroke();
    // robe highlight
    g.strokeStyle = 'rgba(255,240,200,0.5)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(25, 42); g.quadraticCurveTo(21, 52, 22, 60); g.stroke();
    // belt
    g.fillStyle = '#6a3412'; g.fillRect(20, 50, 24, 4);
    g.strokeStyle = line; g.lineWidth = 1; g.strokeRect(20, 50, 24, 4);
    rrect(g, 29, 49, 6, 6, 1.5); g.fillStyle = '#ffd24a'; g.fill(); g.strokeStyle = '#8a5a0a'; g.stroke();
    // staff (in front hand)
    g.strokeStyle = '#4a2c14'; g.lineWidth = 3.2; g.lineCap = 'round';
    g.beginPath(); g.moveTo(47, 30); g.lineTo(47, 68); g.stroke();
    g.strokeStyle = '#9a6a3a'; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(46.2, 32); g.lineTo(46.2, 66); g.stroke();
    g.fillStyle = rg(g, 47, 28, 0, 47, 28, 12, [[0, 'rgba(255,230,140,0.9)'], [1, 'rgba(255,150,40,0)']]);
    g.fillRect(34, 15, 26, 26);
    ell(g, 47, 28, 4.2, 4.2, rg(g, 46, 27, 0.5, 47, 28, 5, [[0, '#fffbe0'], [1, '#ff9a1f']]), '#8a4a0a', 1);
    // arm / hand
    g.beginPath(); g.moveTo(39, 41); g.quadraticCurveTo(46, 44, 47, 49); g.lineWidth = 5.5; g.strokeStyle = line; g.stroke();
    g.lineWidth = 3.6; g.strokeStyle = '#f08a2a'; g.stroke();
    ell(g, 47, 49, 3, 3, '#ffd9b0', line, 1);
    // head
    ell(g, 32, 34, 10, 9.5, rg(g, 28, 30, 1, 32, 34, 12, [[0, '#fff0d8'], [1, '#f2b88a']]), line, 1.4);

  const STICK_RADIUS = 60;
  const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };

  canvas.addEventListener('pointerdown', e => {
    if (state === 'levelup') { tapCards(e.clientX, e.clientY); return; }
    if (e.pointerType === 'mouse' || stick.active) return;
    stick.active = true;
    stick.id = e.pointerId;
    stick.ox = stick.x = e.clientX;
    stick.oy = stick.y = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!stick.active || e.pointerId !== stick.id) return;
    stick.x = e.clientX;
    stick.y = e.clientY;
  });
  const endStick = e => {
    if (e.pointerId === stick.id) { stick.active = false; stick.id = null; }
  };
  canvas.addEventListener('pointerup', endStick);
  canvas.addEventListener('pointercancel', endStick);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  function getInput() {
    let x = 0, y = 0;
    if (keys.has('a') || keys.has('arrowleft')) x -= 1;
    if (keys.has('d') || keys.has('arrowright')) x += 1;
    if (keys.has('w') || keys.has('arrowup')) y -= 1;
    if (keys.has('s') || keys.has('arrowdown')) y += 1;
    if (x || y) {
      const l = Math.hypot(x, y);
      return { x: x / l, y: y / l };
    }
    if (stick.active) {
      const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
      const d = Math.hypot(dx, dy);
      if (d > 4) {
        const m = Math.min(d / STICK_RADIUS, 1);
        return { x: dx / d * m, y: dy / d * m };
      }
    }
    return { x: 0, y: 0 };
  }

    { id: 'dmg',    icon: '攻', name: '魔力増幅',   desc: '弾の威力 +25%',        max: 8, color: '#ff8a3d' },
    { id: 'rate',   icon: '速', name: '高速詠唱',   desc: '発射間隔 -15%',        max: 8, color: '#ffd23f' },
    { id: 'count',  icon: '数', name: '多重詠唱',   desc: '同時に撃つ弾 +1',      max: 5, color: '#ff6a8a' },
    { id: 'pierce', icon: '貫', name: '貫通の魔弾', desc: '敵を1体多く貫通',      max: 4, color: '#b58aef' },
    { id: 'move',   icon: '足', name: '軽やかな足', desc: '移動速度 +10%',        max: 5, color: '#6ad8ff' },
    { id: 'magnet', icon: '吸', name: '引き寄せ',   desc: '宝石を吸い込む範囲 +40%', max: 5, color: '#7dff8a' },
    { id: 'range',  icon: '射', name: '遠見の瞳',   desc: '射程 +15%',            max: 5, color: '#8fb8ff' },
  ];
  let choices = [];
  let levelupDelay = 0;

  function rollChoices() {
    const pool = UPGRADES.filter(u => up[u.id] < u.max);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    choices = pool.slice(0, 3);
  }
  function startLevelUp() {
    state = 'levelup';
    levelupDelay = 0.4;
    stick.active = false;
    rollChoices();
    if (!choices.length) { finishLevelUp(); }
  }
  function finishLevelUp() {
    pending--;
    if (pending > 0) startLevelUp(); else state = 'playing';
  }
  function chooseUpgrade(i) {
    if (state !== 'levelup' || levelupDelay > 0 || !choices[i]) return;
    up[choices[i].id]++;
    recalc();
    rings.push({ t: 0 });
    finishLevelUp();
  }
  function addXp(v) {
    xp += v;
    while (xp >= xpNeed(level)) {
      xp -= xpNeed(level);
      level++;
      pending++;
      burst(player.x, player.y - 30, '#ffd24a', 24);
    }
    if (pending > 0 && state === 'playing') startLevelUp();
  }

  // ---- enemies ----
  function pickType() {
    let total = 0;
    for (const t of ENEMY_TYPES) if (time >= t.minT) total += t.weight;
    let r = Math.random() * total;
    for (const t of ENEMY_TYPES) {
      if (time < t.minT) continue;
      r -= t.weight;
      if (r <= 0) return t;
    }
    return ENEMY_TYPES[0];
  }
  function spawnEnemy(near) {
    if (enemies.length >= MAX_ENEMIES) return;
    const ang = Math.random() * TAU;
    const dist = near ? 110 + Math.random() * 120 : Math.hypot(W, H) / 2 + 70;
    const t = pickType();
    const hp = Math.round(t.hp * (1 + time / 120));
    enemies.push({
      t, x: player.x + Math.cos(ang) * dist, y: player.y + Math.sin(ang) * dist,
      phase: Math.random() * TAU, face: 1, hp, flash: 0,
    });
  }
  function updateEnemies(dt) {
    spawnTimer -= dt;
    const interval = Math.max(0.22, 1.0 - time * 0.005);
    while (spawnTimer <= 0) { spawnEnemy(false); spawnTimer += interval; }

    for (const e of enemies) {
      const t = e.t;
      e.flash = Math.max(0, e.flash - dt);
      const dx = player.x - e.x, dy = player.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      let mx = dx / d, my = dy / d;
      if (t.weave) { // flyers wobble sideways
        const w = Math.sin(time * 3 + e.phase) * t.weave * dt / t.speed;
        mx += -my * w * 4; my += mx * w * 4;
      }
      e.x += mx * t.speed * dt;
      e.y += my * t.speed * dt;
      if (Math.abs(dx) > 2) e.face = dx > 0 ? 1 : -1;
    }
    // soft separation so enemies do not stack into one blob
    for (let i = 0; i < enemies.length; i++) {
      const a = enemies[i];
      for (let j = i + 1; j < enemies.length; j++) {
        const b = enemies[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const min = a.t.r + b.t.r;
        if (Math.abs(dx) > min || Math.abs(dy) > min) continue;
        const d = Math.hypot(dx, dy);
        if (d > 0 && d < min) {
          const push = (min - d) / 2 / d;
          a.x -= dx * push; a.y -= dy * push;
          b.x += dx * push; b.y += dy * push;
        }
      }
    }
    const far = Math.hypot(W, H) + 400;
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y) > far) enemies.splice(i, 1);
    }
  }

  // ---- weapon: auto-firing magic bolts ----
  const BOLT_SPEED = 460, BOLT_R = 6;
  const weapon = { timer: 0 };
  function nearestEnemy(maxDist) {
    let best = null, bd = maxDist * maxDist;
    for (const e of enemies) {
      const d = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }
  function burst(x, y, color, n) {
    for (let i = 0; i < (n || 10); i++) {
      const a = Math.random() * TAU, sp = 60 + Math.random() * 130;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.3 + Math.random() * 0.35, color });
    }
  }
  function hitEnemy(e, dmg, vx, vy) {
    e.hp -= dmg;
    e.flash = 0.09;
    const d = Math.hypot(vx, vy) || 1;
    const k = 10 / Math.max(1, e.t.r / 12);
    e.x += vx / d * k; e.y += vy / d * k;
    popups.push({ x: e.x, y: e.y - e.t.cy * 1.7, text: String(dmg), life: 0.55 });
    burst(e.x, e.y - e.t.cy, '#fff4c2', 3);
  }
  function updateWeapon(dt) {
    weapon.timer -= dt;
    if (weapon.timer <= 0) {
      const target = nearestEnemy(S.range);
      if (target) {
        const ox = player.x + player.face * 15, oy = player.y - 38;
        const base = Math.atan2(target.y - target.t.cy - oy, target.x - ox);
        for (let i = 0; i < S.count; i++) {
          const a = base + (i - (S.count - 1) / 2) * 0.2;
          bolts.push({
            x: ox, y: oy, vx: Math.cos(a) * BOLT_SPEED, vy: Math.sin(a) * BOLT_SPEED,
            life: S.range / BOLT_SPEED * 1.25, pierce: S.pierce, hit: new Set(),
          });
        }
        weapon.timer = S.cooldown;
      } else {
        weapon.timer = 0.1;
      }
    }
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let dead = b.life <= 0;
      for (const e of enemies) {
        if (b.hit.has(e)) continue;
        const rr = e.t.hitR + BOLT_R;
        const dx = e.x - b.x, dy = e.y - e.t.cy - b.y;
        if (dx * dx + dy * dy < rr * rr) {
          b.hit.add(e);
          hitEnemy(e, S.damage, b.vx, b.vy);
          if (b.pierce-- <= 0) { dead = true; break; }
        }
      }
      if (dead) bolts.splice(i, 1);
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.hp <= 0) {
        kills++;
        burst(e.x, e.y - e.t.cy, e.t.color, 12);
        gems.push({ x: e.x, y: e.y - 2, v: e.t.xp, ph: Math.random() * TAU, s: 0, mag: false });
        enemies.splice(i, 1);
      }
    }
  }

  function updateGems(dt) {
    for (let i = gems.length - 1; i >= 0; i--) {
      const g = gems[i];
      const dx = player.x - g.x, dy = (player.y - 10) - g.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < S.magnet) g.mag = true;
      if (g.mag) {
        g.s = Math.min(g.s + 1000 * dt, 640);
        g.x += dx / d * g.s * dt; g.y += dy / d * g.s * dt;
      }
      if (d < 18) { addXp(g.v); gems.splice(i, 1); }
    }
    while (gems.length > 300) { const g = gems.shift(); addXp(g.v); }
  }

  function updateFx(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      p.vx *= 0.92; p.vy *= 0.92;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].y -= 30 * dt; popups[i].life -= dt;
      if (popups[i].life <= 0) popups.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].t += dt;
      if (rings[i].t > 0.7) rings.splice(i, 1);
    }
  }

  function update(dt) {
    clock += dt;
    if (state === 'levelup') {
      levelupDelay = Math.max(0, levelupDelay - dt);
      updateFx(dt);
      return;
    }
    time += dt;
    const v = getInput();
    player.x += v.x * player.speed * dt;
    player.y += v.y * player.speed * dt;
    if (v.x > 0.1) player.face = 1; else if (v.x < -0.1) player.face = -1;
    player.moving = !!(v.x || v.y);
    player.walk = player.moving ? player.walk + dt * 11 : 0;
    cam.x = player.x;
    cam.y = player.y;
    updateEnemies(dt);
    updateWeapon(dt);
    updateGems(dt);
    updateFx(dt);
  }

  // =====================================================================
  // Rendering
  // =====================================================================
  function drawGround() {
    const tx0 = Math.floor(camL / TILE), ty0 = Math.floor(camT / TILE);
    const tx1 = Math.floor((camL + W) / TILE), ty1 = Math.floor((camT + H) / TILE);
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const v = Math.floor(hash(tx, ty, 1) * tiles.length);
        ctx.drawImage(tiles[v], tx * TILE - camL, ty * TILE - camT, TILE + 0.6, TILE + 0.6);
      }
    }
  }

  function shadow(x, y, rx, ry, a) {
    ctx.fillStyle = `rgba(6,22,12,${a})`;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
    ctx.fill();
  }

  const items = [];
  function drawWorld() {
    items.length = 0;
    // decor
    const cx0 = Math.floor((camL - 110) / CELL), cx1 = Math.floor((camL + W + 110) / CELL);
    const cy0 = Math.floor((camT - 30) / CELL), cy1 = Math.floor((camT + H + 180) / CELL);
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const d = decorAt(cx, cy);
        if (!d) continue;
        const k = DEC[d.k];
        if (k.sh) shadow(d.x - camL + k.sh[2], d.y - camT + 2, k.sh[0], k.sh[1], 0.28);
        items.push({ y: d.y, t: 0, d, k });
      }
    }
    // gems (on the ground)
    for (const g of gems) {
      const sx = g.x - camL, sy = g.y - camT;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      shadow(sx, sy + 2, 5, 2, 0.25);
      const spr = gemSpr[g.v >= 5 ? 2 : g.v >= 2 ? 1 : 0];
      const bob = Math.sin(clock * 4 + g.ph) * 2;
      ctx.drawImage(spr, sx - 14, sy - 22 + bob, 28, 28);
    }
    // enemy + player shadows
    for (const e of enemies) {
      const sx = e.x - camL, sy = e.y - camT;
      if (sx < -70 || sx > W + 70 || sy < -70 || sy > H + 90) continue;
      const k = e.t.fly ? 0.75 : 1;
      shadow(sx, sy + 2, e.t.sh * k, e.t.sh * 0.34 * k, 0.3);
      items.push({ y: e.y, t: 1, e });
    }
    const px = player.x - camL, py = player.y - camT;
    shadow(px, py + 2, 15, 5, 0.32);
    items.push({ y: player.y, t: 2 });
    items.sort((a, b) => a.y - b.y);

    for (const it of items) {
      if (it.t === 0) {
        const { d, k } = it;
        ctx.drawImage(k.s, d.x - camL - k.ax, d.y - camT - k.ay, k.w, k.h);
      } else if (it.t === 1) {
        drawEnemy(it.e);
      } else {
        drawPlayer();
      }
    }
  }

  function drawEnemy(e) {
    const t = e.t;
    const f = ((time * 5 + e.phase) | 0) & 1;
    const lift = t.fly ? Math.sin(time * 4 + e.phase) * 2.5 : 0;
    ctx.save();
    ctx.translate(e.x - camL, e.y - camT + lift);
    ctx.scale(e.face, 1);
    ctx.drawImage(t.spr[f], -t.ax, -t.ay, t.w, t.h);
    if (e.flash > 0) {
      ctx.globalAlpha = 0.8;
      ctx.drawImage(t.flash[f], -t.ax, -t.ay, t.w, t.h);
    }
    ctx.restore();
  }

  function drawPlayer() {
    const px = player.x - camL, py = player.y - camT;
    const frame = player.moving ? (Math.floor(player.walk) % 4) : 0;
    const breathe = player.moving ? 0 : Math.sin(clock * 3) * 0.8;
    ctx.save();
    ctx.translate(px, py + breathe);
    ctx.scale(player.face, 1);
    ctx.drawImage(playerFrames[frame], -PAX, -PAY, PW, PH);
    ctx.restore();
    // pulsing glow on the staff orb
    const gx = px + player.face * 15, gy = py - 38 + breathe;
    const pulse = 0.75 + Math.sin(clock * 5) * 0.25;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rg(ctx, gx, gy, 0, gx, gy, 18, [[0, `rgba(255,200,90,${0.55 * pulse})`], [1, 'rgba(255,150,40,0)']]);
    ctx.fillRect(gx - 18, gy - 18, 36, 36);
    ctx.restore();
  }

  function drawEffects() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life * 3);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - camL - 2, p.y - camT - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    for (const b of bolts) {
      const sx = b.x - camL, sy = b.y - camT;
      const l = Math.hypot(b.vx, b.vy);
      const tx = sx - b.vx / l * 34, ty = sy - b.vy / l * 34;
      ctx.strokeStyle = lg(ctx, sx, sy, tx, ty, [[0, 'rgba(255,190,70,0.85)'], [1, 'rgba(255,120,20,0)']]);
      ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.fillStyle = rg(ctx, sx, sy, 1, sx, sy, 18, [[0, 'rgba(255,225,130,0.9)'], [1, 'rgba(255,140,30,0)']]);
      ctx.fillRect(sx - 18, sy - 18, 36, 36);
    }
    ctx.restore();
    for (const b of bolts) {
      const sx = b.x - camL, sy = b.y - camT;
      ctx.fillStyle = '#fff8d6';
      ctx.beginPath(); ctx.arc(sx, sy, BOLT_R - 1.5, 0, TAU); ctx.fill();
    }
    // level-up rings
    for (const r of rings) {
      const k = r.t / 0.7;
      ctx.strokeStyle = `rgba(255,220,110,${1 - k})`;
      ctx.lineWidth = 6 * (1 - k) + 1;
      ctx.beginPath();
      ctx.ellipse(player.x - camL, player.y - camT - 6, 20 + k * 90, (20 + k * 90) * 0.4, 0, 0, TAU);
      ctx.stroke();
    }
    // damage numbers
    ctx.font = `bold 15px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.fillStyle = '#fff';
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life * 4);
      ctx.strokeText(p.text, p.x - camL, p.y - camT);
      ctx.fillText(p.text, p.x - camL, p.y - camT);
    }
    ctx.globalAlpha = 1;
  }

  function drawHud() {
    const top = (parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0) + 10;
    const bx = 12, bw = W - 24, bh = 16;
    // XP bar
    rrect(ctx, bx, top, bw, bh, 8);
    ctx.fillStyle = 'rgba(8,16,30,0.6)'; ctx.fill();
    const frac = Math.min(1, xp / xpNeed(level));
    if (frac > 0) {
      ctx.save();
      rrect(ctx, bx, top, bw, bh, 8); ctx.clip();
      ctx.fillStyle = lg(ctx, bx, 0, bx + bw, 0, [[0, '#3ad0ff'], [1, '#6a7dff']]);
      ctx.fillRect(bx, top, Math.max(bh, bw * frac), bh);
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(bx, top, bw, bh / 2);
      ctx.restore();
    }
    rrect(ctx, bx, top, bw, bh, 8);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.font = `bold 12px ${FONT}`;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.strokeText('Lv ' + level, bx + 10, top + 12.5);
    ctx.fillText('Lv ' + level, bx + 10, top + 12.5);
    // kills + time
    ctx.font = `bold 15px ${FONT}`;
    const y = top + bh + 22;
    const mm = String(Math.floor(time / 60)).padStart(2, '0'), ss = String(Math.floor(time % 60)).padStart(2, '0');
    ctx.strokeText('撃破 ' + kills, bx + 2, y); ctx.fillText('撃破 ' + kills, bx + 2, y);
    ctx.textAlign = 'right';
    ctx.strokeText(mm + ':' + ss, W - bx - 2, y); ctx.fillText(mm + ':' + ss, W - bx - 2, y);
  }

  function drawStick() {
    if (!stick.active) return;
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    const d = Math.hypot(dx, dy) || 1;
    const m = Math.min(d, STICK_RADIUS);
    const kx = stick.ox + dx / d * m, ky = stick.oy + dy / d * m;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_RADIUS, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(kx, ky, 26, 0, TAU); ctx.fill();
  }

  // ---- level-up screen ----
  function layoutCards() {
    const cw = Math.min(W - 32, 420);
    const ch = Math.max(66, Math.min(96, (H - 190) / 3 - 12));
    const total = 3 * ch + 24;
    const y0 = Math.max(120, (H - total) / 2 + 36);
    return choices.map((c, i) => ({ x: (W - cw) / 2, y: y0 + i * (ch + 12), w: cw, h: ch }));
  }
  function tapCards(px, py) {
    const rects = layoutCards();
    for (let i = 0; i < rects.length; i++) {
      const r = rects[i];
      if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) { chooseUpgrade(i); return; }
    }
  }
  function drawLevelUp() {
    ctx.fillStyle = 'rgba(6,12,24,0.72)';
    ctx.fillRect(0, 0, W, H);
    const rects = layoutCards();
    const ty = Math.max(70, rects[0].y - 54);
    ctx.textAlign = 'center';
    ctx.font = `900 34px ${FONT}`;
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(80,40,0,0.9)';
    ctx.fillStyle = lg(ctx, 0, ty - 30, 0, ty + 4, [[0, '#fff2a8'], [1, '#ffb62a']]);
    ctx.strokeText('LEVEL UP!', W / 2, ty); ctx.fillText('LEVEL UP!', W / 2, ty);
    ctx.font = `bold 14px ${FONT}`;
    ctx.fillStyle = '#cfe0ff';
    ctx.fillText(`Lv ${level}　強化を1つ選んでください`, W / 2, ty + 26);
    const ready = levelupDelay <= 0;
    choices.forEach((c, i) => {
      const r = rects[i];
      ctx.globalAlpha = ready ? 1 : 0.55;
      rrect(ctx, r.x, r.y, r.w, r.h, 14);
      ctx.fillStyle = lg(ctx, 0, r.y, 0, r.y + r.h, [[0, 'rgba(44,58,90,0.97)'], [1, 'rgba(24,32,56,0.97)']]);
      ctx.fill();
      ctx.strokeStyle = c.color; ctx.lineWidth = 2; ctx.stroke();
      const ir = Math.min(26, r.h * 0.32), ix = r.x + 18 + ir, iy = r.y + r.h / 2;
      ctx.fillStyle = rg(ctx, ix - ir * 0.3, iy - ir * 0.3, 2, ix, iy, ir, [[0, '#fff'], [0.3, c.color], [1, 'rgba(0,0,0,0.5)']]);
      ctx.beginPath(); ctx.arc(ix, iy, ir, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.font = `900 ${Math.round(ir * 1.05)}px ${FONT}`;
      ctx.fillStyle = '#1a1a2a'; ctx.textAlign = 'center';
      ctx.fillText(c.icon, ix, iy + ir * 0.37);
      const tx = ix + ir + 16;
      ctx.textAlign = 'left';
      ctx.font = `bold 18px ${FONT}`;
      ctx.fillStyle = '#fff';
      ctx.fillText(c.name, tx, r.y + r.h / 2 - 6);
      ctx.font = `13px ${FONT}`;
      ctx.fillStyle = '#b8c8e8';
      ctx.fillText(c.desc, tx, r.y + r.h / 2 + 14);
      ctx.font = `bold 12px ${FONT}`;
      ctx.textAlign = 'right';
      ctx.fillStyle = c.color;
      ctx.fillText(`Lv ${up[c.id]} → ${up[c.id] + 1}`, r.x + r.w - 14, r.y + 22);
      if (W > 560) {
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.fillText(`[${i + 1}]`, r.x + r.w - 14, r.y + r.h - 12);
      }
      ctx.globalAlpha = 1;
    });
    ctx.textAlign = 'left';
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    camL = Math.round(cam.x - W / 2);
    camT = Math.round(cam.y - H / 2);
    drawGround();
    drawWorld();
    drawEffects();
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
    drawHud();
    drawStick();
    if (state === 'levelup') drawLevelUp();
  }

  // debug hooks for testing
  window.__dbg = { addXp, spawnNear: n => { for (let i = 0; i < n; i++) spawnEnemy(true); }, get state() { return state; }, choose: chooseUpgrade };

  // =====================================================================
  // Loop
  // =====================================================================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
