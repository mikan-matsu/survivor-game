<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Survivor Game</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #5bab52;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const BUILD = '31-faster-levels';
  const FONT = "system-ui, 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif";
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, dpr = 1, vignette = null, safeTop = 0;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    safeTop = parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    const r = Math.hypot(W, H) / 2;
    vignette = ctx.createRadialGradient(W / 2, H / 2, r * 0.45, W / 2, H / 2, r);
    vignette.addColorStop(0, 'rgba(10,50,30,0)');
    vignette.addColorStop(1, 'rgba(10,50,30,0.3)');
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  // =====================================================================
  // Drawing helpers
  // =====================================================================
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // deterministic hash -> [0,1)
  function hash(x, y, s) {
    let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  // pre-render a sprite at 2x resolution; draw with logical size w x h
  function mk(w, h, fn) {
    const c = document.createElement('canvas');
    c.width = w * 2; c.height = h * 2;
    const g = c.getContext('2d');
    g.scale(2, 2);
    fn(g);
    return c;
  }
  function silhouette(src, color) {
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    const g = c.getContext('2d');
    g.drawImage(src, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = color || '#fff';
    g.fillRect(0, 0, c.width, c.height);
    return c;
  }
  function lg(g, x0, y0, x1, y1, stops) {
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    for (const s of stops) gr.addColorStop(s[0], s[1]);
    return gr;
  }
  function rg(g, x0, y0, r0, x1, y1, r1, stops) {
    const gr = g.createRadialGradient(x0, y0, r0, x1, y1, r1);
    for (const s of stops) gr.addColorStop(s[0], s[1]);
    return gr;
  }
  function ell(g, x, y, rx, ry, fill, stroke, lw, rot) {
    g.beginPath();
    g.ellipse(x, y, rx, ry, rot || 0, 0, TAU);
    if (fill) { g.fillStyle = fill; g.fill(); }
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1.5; g.stroke(); }
  }
  function poly(g, pts, fill, stroke, lw) {
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.closePath();
    if (fill) { g.fillStyle = fill; g.fill(); }
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 1.5; g.lineJoin = 'round'; g.stroke(); }
  }
  function rrect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  // =====================================================================
  // ART DIRECTION: "Hollow Night"
  // A moonlit, cursed forest. Flat angular shapes lit by a cold moon from
  // the top-left (rim light + dark far side), no outlines. Everything alive
  // glows: eyes, cores, runes. Palette: ink teal-black ground, moon blue,
  // spirit teal, curse magenta, lantern amber.
  // =====================================================================
  const MOON = 'rgba(255,246,205,0.95)';

  // flat shape + moon-lit gradient + rim light. Path must already be built.
  function lit(g, base, bb, rim) {
    g.fillStyle = base; g.fill();
    g.save(); g.clip();
    g.fillStyle = lg(g, bb[0], bb[1], bb[2], bb[3], [[0, 'rgba(255,250,220,0.34)'], [0.5, 'rgba(0,0,0,0)'], [1, 'rgba(20,30,80,0.34)']]);
    g.fillRect(bb[0] - 2, bb[1] - 2, bb[2] - bb[0] + 4, bb[3] - bb[1] + 4);
    g.restore();
    if (rim !== false) {
      g.strokeStyle = lg(g, bb[0], bb[1], bb[2], bb[3], [[0, rim || MOON], [0.5, 'rgba(255,246,205,0)']]);
      g.lineWidth = 1.3; g.lineJoin = 'round'; g.stroke();
    }
  }
  function P(g, pts, base, rim) {
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); g.lineTo(x, y); }
    g.closePath();
    lit(g, base, [x0, y0, x1, y1], rim);
  }
  function E(g, cx, cy, rx, ry, base, rim, rot) {
    g.beginPath(); g.ellipse(cx, cy, rx, ry, rot || 0, 0, TAU);
    const m = Math.max(rx, ry);
    lit(g, base, [cx - m, cy - m, cx + m, cy + m], rim);
  }
  function glow(g, x, y, r, rgb, a) {
    g.save(); g.globalCompositeOperation = 'lighter';
    g.fillStyle = rg(g, x, y, 0, x, y, r, [[0, `rgba(${rgb},${a})`], [1, `rgba(${rgb},0)`]]);
    g.fillRect(x - r, y - r, r * 2, r * 2);
    g.restore();
  }
  // glowing slit eye
  function eye(g, x, y, w, h, rgb, rot) {
    glow(g, x, y, w * 3, rgb, 0.55);
    g.beginPath(); g.ellipse(x, y, w, h, rot || 0, 0, TAU);
    g.fillStyle = `rgb(${rgb})`; g.fill();
    g.beginPath(); g.ellipse(x, y, w * 0.5, h * 0.55, rot || 0, 0, TAU);
    g.fillStyle = '#fff'; g.fill();
  }
  function line(g, pts, col, w) {
    g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.stroke();
  }

  // =====================================================================
  // Ground tiles: damp forest floor, fallen leaves, moss, glowing spores
  // =====================================================================
  const TILE = 128;
  function wraps(x, y, m) {
    const xs = [0], ys = [0];
    if (x < m) xs.push(TILE); else if (x > TILE - m) xs.push(-TILE);
    if (y < m) ys.push(TILE); else if (y > TILE - m) ys.push(-TILE);
    const out = [];
    for (const a of xs) for (const b of ys) out.push([a, b]);
    return out;
  }
  function makeTile(seed) {
    return mk(TILE, TILE, g => {
      const R = rng(seed);
      g.fillStyle = '#5bab52';
      g.fillRect(0, 0, TILE, TILE);
      for (let i = 0; i < 10; i++) {
        const x = R() * TILE, y = R() * TILE, r = 24 + R() * 34;
        const lightBlob = R() < 0.5, c = lightBlob ? '160,225,110' : '30,100,60', a = 0.03;
        for (const [ox, oy] of wraps(x, y, r)) {
          g.fillStyle = rg(g, x + ox, y + oy, 0, x + ox, y + oy, r, [[0, `rgba(${c},${a})`], [1, `rgba(${c},0)`]]);
          g.fillRect(x + ox - r, y + oy - r, r * 2, r * 2);
        }
      }
      const blades = ['#3f9248', '#78cc66', '#2f7d3e', '#92dc7a', '#4aa856'];
      g.lineCap = 'round';
      for (let i = 0; i < 140; i++) {
        const x = R() * TILE, y = R() * TILE, h = 3 + R() * 6, lean = (R() - 0.5) * 4;
        g.strokeStyle = blades[Math.floor(R() * blades.length)]; g.lineWidth = 1 + R() * 0.6;
        for (const [ox, oy] of wraps(x, y, 8)) {
          g.beginPath(); g.moveTo(x + ox, y + oy);
          g.quadraticCurveTo(x + ox + lean * 0.3, y + oy - h * 0.6, x + ox + lean, y + oy - h); g.stroke();
        }
      }
      // tiny wildflowers (white and pink only, so nothing reads as an experience gem)
      const petals = ['#ffffff', '#ffd3e4', '#fff3f8'];
      for (let i = 0; i < 6; i++) {
        const x = R() * TILE, y = R() * TILE, c = petals[Math.floor(R() * petals.length)];
        for (const [ox, oy] of wraps(x, y, 5)) {
          for (let k = 0; k < 4; k++) { const a = k * TAU / 4; g.fillStyle = c; g.beginPath(); g.arc(x + ox + Math.cos(a) * 1.6, y + oy + Math.sin(a) * 1.6, 1.3, 0, TAU); g.fill(); }
          g.fillStyle = '#f2c14a'; g.beginPath(); g.arc(x + ox, y + oy, 0.9, 0, TAU); g.fill();
        }
      }
      // dry leaves and pebbles
      const leaf = ['rgba(214,150,60,0.8)', 'rgba(190,100,50,0.75)', 'rgba(230,190,90,0.75)'];
      for (let i = 0; i < 7; i++) {
        const x = R() * TILE, y = R() * TILE, a = R() * TAU, s = 2.5 + R() * 2.5;
        g.fillStyle = leaf[Math.floor(R() * leaf.length)];
        for (const [ox, oy] of wraps(x, y, 6)) {
          g.save(); g.translate(x + ox, y + oy); g.rotate(a);
          g.beginPath(); g.moveTo(-s, 0); g.lineTo(0, -s * 0.55); g.lineTo(s, 0); g.lineTo(0, s * 0.55); g.closePath(); g.fill();
          g.restore();
        }
      }
      for (let i = 0; i < 5; i++) {
        const x = R() * TILE, y = R() * TILE;
        for (const [ox, oy] of wraps(x, y, 5)) {
          g.fillStyle = 'rgba(225,228,214,0.8)';
          g.beginPath(); g.ellipse(x + ox, y + oy, 1.8 + R(), 1.2, 0, 0, TAU); g.fill();
        }
      }
    });
  }
  const tiles = [];
  for (let i = 0; i < 6; i++) tiles.push(makeTile(2000 + i * 91));

  // =====================================================================
  // Decor: dead trees, pines, graves, ruins, glowing fungi, lanterns...
  // =====================================================================
  function drawLeafTree(g, v, seed) {
    const R = rng(seed);
    P(g, [[52, 158], [57, 128], [56, 96], [59, 72], [69, 72], [71, 96], [71, 128], [78, 158]], '#8a5a38');
    line(g, [[56, 156], [60, 128], [59, 96]], 'rgba(255,246,200,0.55)', 1.4);
    P(g, [[64, 100], [78, 86], [80, 90], [66, 108]], '#7a4e30', false);
    const pal = [['#2f8a45', '#4fb35a', '#97e47c'], ['#5d9a2e', '#86c43c', '#d2ec6a'], ['#d2692f', '#ee9a3a', '#ffd070']][v];
    const blobs = [[64, 70, 30], [40, 74, 22], [88, 74, 22], [52, 46, 24], [76, 46, 24], [64, 32, 20]];
    for (let L = 0; L < 3; L++) {
      for (const [bx, by, br] of blobs) {
        const x = bx - L * 3, y = by - L * 4, r = br - L * 4.5;
        g.beginPath(); g.ellipse(x, y, r, r * 0.9, 0, 0, TAU);
        lit(g, pal[L], [x - r, y - r, x + r, y + r], L === 2 ? 'rgba(255,255,230,0.7)' : false);
      }
    }
    for (let i = 0; i < 8; i++) {
      const a = R() * TAU, d = 10 + R() * 30, x = 64 + Math.cos(a) * d, y = 56 + Math.sin(a) * d * 0.7;
      if (v === 0) E(g, x, y, 3, 3, '#ff5a5a', false); else E(g, x, y, 2.4, 1.4, pal[2], false, R() * 3);
    }
  }
  function drawPine(g) {
    P(g, [[60, 158], [62, 120], [66, 120], [68, 158]], '#7a4e30');
    const tiers = [[64, 132, 38], [54, 106, 32], [44, 80, 28], [32, 56, 24]];
    tiers.forEach(([w, y, h], i) => {
      P(g, [[64, y - h], [64 + w / 2, y], [64 + w * 0.22, y - 5], [64, y + 2], [64 - w * 0.22, y - 5], [64 - w / 2, y]],
        ['#2a8c50', '#34a15c', '#40b668', '#52cc7c'][i], 'rgba(255,255,220,0.65)');
    });
  }
  function drawBushN(g, v) {
    const blobs = [[20, 30, 16], [34, 24, 19], [47, 31, 15], [30, 33, 13]];
    for (const [x, y, r] of blobs) { E(g, x, y, r, r * 0.85, v ? '#4aa84e' : '#3fa65a', 'rgba(255,255,220,0.7)'); }
    for (const [x, y] of [[18, 26], [30, 17], [42, 22], [48, 30], [26, 34]]) {
      if (v) { E(g, x, y, 2.6, 2.6, '#ff4f6a', 'rgba(255,255,255,0.8)'); }
      else { E(g, x - 1, y, 2.2, 1.6, '#c8f08a', false, 0.5); }
    }
  }
  function drawBoulder(g, v) {
    P(g, [[4, 46], [8, 28], [22, 10], [44, 6], [62, 20], [68, 46]], '#a9b1ba', 'rgba(255,255,235,0.8)');
    P(g, [[44, 6], [62, 20], [68, 46], [54, 46], [50, 24]], 'rgba(40,50,80,0.25)', false);
    E(g, 18, 18, 9, 3.5, 'rgba(76,170,80,0.85)', false, -0.5);
    line(g, [[30, 26], [36, 36], [32, 46]], 'rgba(40,50,70,0.5)', 1.2);
    if (v) P(g, [[0, 50], [2, 42], [10, 38], [16, 42], [16, 50]], '#9aa3ae');
  }
  function drawStumpN(g) {
    P(g, [[14, 30], [14, 50], [20, 56], [44, 56], [50, 50], [50, 30]], '#8a5a38');
    E(g, 32, 30, 18, 7, '#d9a86a', 'rgba(255,246,200,0.7)');
    E(g, 32, 30, 12, 4.5, false, 'rgba(120,76,40,0.7)'); E(g, 32, 30, 6, 2.2, false, 'rgba(120,76,40,0.7)');
    E(g, 20, 54, 9, 3, 'rgba(76,170,80,0.85)', false);
  }
  function drawFlowerClump(g, v) {
    const cols = [['#ff7ab0', '#ffe0ec'], ['#ffffff', '#ffd9a0']][v];
    for (const [x, y] of [[14, 38], [26, 30], [38, 36], [20, 44], [34, 46]]) {
      line(g, [[x, 52], [x, y]], '#2f9a4a', 1.8);
      for (let k = 0; k < 5; k++) { const a = k * TAU / 5; E(g, x + Math.cos(a) * 3.2, y + Math.sin(a) * 3.2, 2.6, 2.6, cols[0], false); }
      E(g, x, y, 1.8, 1.8, cols[1] === '#ffe0ec' ? '#ffd84a' : '#ffb347', false);
    }
    for (const x of [8, 20, 32, 44]) P(g, [[x - 3, 54], [x, 44], [x + 3, 54]], '#3aae5a', false);
  }
  function drawPillar(g) {
    P(g, [[18, 64], [20, 28], [16, 20], [26, 14], [40, 22], [46, 18], [46, 64]], '#bcc3cc', 'rgba(255,255,235,0.8)');
    for (const y of [34, 44, 54]) line(g, [[20, y], [46, y - 1]], 'rgba(60,70,90,0.35)', 1.2);
    E(g, 28, 16, 7, 3, 'rgba(76,170,80,0.85)', false);
    P(g, [[22, 46], [28, 40], [30, 50], [24, 56]], 'rgba(76,170,80,0.75)', false);
    E(g, 20, 62, 8, 3, 'rgba(76,170,80,0.85)', false);
  }
  function drawMushroomN(g, v) {
    const cap = v ? '#f0903a' : '#e8483f', hi = v ? '#ffd29a' : '#ff9a8a';
    for (const [x, y, r] of [[14, 36, 7], [26, 30, 10], [38, 38, 6]]) {
      P(g, [[x - 2, 46], [x - 1.4, y + 3], [x + 1.4, y + 3], [x + 2, 46]], '#f3ead8', false);
      g.beginPath(); g.moveTo(x - r, y + 3); g.quadraticCurveTo(x, y - r * 1.5, x + r, y + 3); g.closePath();
      lit(g, cap, [x - r, y - r, x + r, y + 3], 'rgba(255,255,230,0.9)');
      E(g, x - r * 0.35, y - r * 0.2, r * 0.22, r * 0.18, hi, false);
      E(g, x + r * 0.4, y - r * 0.05, r * 0.16, r * 0.14, hi, false);
      E(g, x, y - r * 0.7, r * 0.14, r * 0.12, '#ffffff', false);
    }
  }
  function drawSignpost(g) {
    P(g, [[30, 78], [31, 26], [35, 26], [36, 78]], '#7a4e30', 'rgba(255,246,200,0.6)');
    P(g, [[16, 24], [46, 24], [52, 30], [46, 36], [16, 36]], '#c98e52', 'rgba(255,246,200,0.7)');
    line(g, [[22, 30], [42, 30]], 'rgba(90,50,20,0.55)', 1.4);
    P(g, [[22, 44], [50, 44], [50, 52], [22, 52], [17, 48]], '#b87c44', false);
    line(g, [[26, 48], [44, 48]], 'rgba(90,50,20,0.55)', 1.4);
    E(g, 33, 78, 8, 3, 'rgba(76,170,80,0.85)', false);
  }
  function drawLog(g) {
    P(g, [[6, 26], [10, 18], [50, 18], [56, 26], [52, 38], [10, 38]], '#8a5a38', 'rgba(255,246,200,0.7)');
    E(g, 54, 28, 5, 9, '#d9a86a', 'rgba(255,246,200,0.6)');
    E(g, 54, 28, 2.5, 5, false, 'rgba(120,76,40,0.7)');
    line(g, [[14, 22], [46, 22]], 'rgba(90,50,24,0.35)', 1.2); line(g, [[12, 32], [48, 32]], 'rgba(90,50,24,0.35)', 1.2);
    E(g, 22, 18, 9, 3, 'rgba(76,170,80,0.85)', false);
  }
  function drawGrassN(g) {
    const cols = ['#2f9a46', '#52c460', '#7ee07a'];
    g.lineCap = 'round';
    for (let i = 0; i < 15; i++) {
      const x = 6 + i * 2.4, h = 12 + (i * 7 % 12), lean = ((i * 5) % 9) - 4;
      g.strokeStyle = cols[i % 3]; g.lineWidth = 1.8;
      g.beginPath(); g.moveTo(x, 30); g.quadraticCurveTo(x + lean * 0.3, 30 - h * 0.6, x + lean, 30 - h); g.stroke();
    }
  }
  const DEC = [
    { s: mk(128, 168, g => drawLeafTree(g, 0, 11)), w: 128, h: 168, ax: 64, ay: 156, sh: [32, 9, 12] },
    { s: mk(128, 168, g => drawLeafTree(g, 1, 29)), w: 128, h: 168, ax: 64, ay: 156, sh: [32, 9, 12] },
    { s: mk(128, 168, g => drawLeafTree(g, 2, 47)), w: 128, h: 168, ax: 64, ay: 156, sh: [32, 9, 12] },
    { s: mk(128, 168, drawPine), w: 128, h: 168, ax: 64, ay: 156, sh: [28, 8, 10] },
    { s: mk(64, 48, g => drawBushN(g, 0)), w: 64, h: 48, ax: 32, ay: 42, sh: [24, 6, 4] },
    { s: mk(64, 48, g => drawBushN(g, 1)), w: 64, h: 48, ax: 32, ay: 42, sh: [24, 6, 4] },
    { s: mk(72, 52, g => drawBoulder(g, 0)), w: 72, h: 52, ax: 36, ay: 46, sh: [28, 7, 6] },
    { s: mk(72, 52, g => drawBoulder(g, 1)), w: 72, h: 52, ax: 36, ay: 46, sh: [28, 7, 6] },
    { s: mk(48, 56, g => drawFlowerClump(g, 0)), w: 48, h: 56, ax: 24, ay: 50, sh: null },
    { s: mk(48, 56, g => drawFlowerClump(g, 1)), w: 48, h: 56, ax: 24, ay: 50, sh: null },
    { s: mk(64, 70, drawPillar), w: 64, h: 70, ax: 32, ay: 62, sh: [20, 6, 6] },
    { s: mk(48, 50, g => drawMushroomN(g, 0)), w: 48, h: 50, ax: 24, ay: 44, sh: [16, 4, 2] },
    { s: mk(48, 50, g => drawMushroomN(g, 1)), w: 48, h: 50, ax: 24, ay: 44, sh: [16, 4, 2] },
    { s: mk(64, 84, drawSignpost), w: 64, h: 84, ax: 32, ay: 78, sh: [14, 4, 4] },
    { s: mk(64, 52, drawLog), w: 64, h: 52, ax: 32, ay: 44, sh: [26, 5, 4] },
    { s: mk(44, 34, drawGrassN), w: 44, h: 34, ax: 22, ay: 30, sh: null },
  ];
  const CELL = 160;
  function decorAt(cx, cy) {
    if (hash(cx, cy, 99) > 0.6) return null;
    const x = (cx + 0.12 + 0.76 * hash(cx, cy, 101)) * CELL;
    const y = (cy + 0.12 + 0.76 * hash(cx, cy, 102)) * CELL;

      burst(e.x + Math.cos(a) * 70, e.y + Math.sin(a) * 50 - 14, '#c050ff', 4);
    }
  }
  function updateEnemies(dt) {
    updateWave(dt);

    for (const e of enemies) {
      const t = e.t;
      e.flash = Math.max(0, e.flash - dt);
      const dx = player.x - e.x, dy = player.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      let mx = dx / d, my = dy / d, spd = t.speed * speedScale();
      if (!e.boss && d > 260) spd *= 1 + Math.min(1.5, (d - 260) / 260); // far-off enemies hurry in, so there is little dead time between waves
      if (e.boss) {
        e.pt += dt;
        if (e.ph === 'walk' && e.pt > 4.5) { e.ph = 'tele'; e.pt = 0; bossSummon(e); }
        else if (e.ph === 'tele') {
          spd = 0;
          e.dx = mx; e.dy = my;
          if (e.pt > 0.8) { e.ph = 'dash'; e.pt = 0; }
        } else if (e.ph === 'dash') {
          mx = e.dx; my = e.dy; spd = 250;
          if (e.pt > 0.9) { e.ph = 'walk'; e.pt = 0; }
        }
      } else if (t.weave) { // flyers wobble sideways
        const w = Math.sin(time * 3 + e.phase) * t.weave * dt / t.speed;
        mx += -my * w * 4; my += mx * w * 4;
      } else if (t.burst && Math.sin(time * 2.4 + e.phase) > 0.6) {
        spd *= 2.2; // spiders skitter in bursts
      }
      if (t.blink) { // reapers blink toward the player
        e.bt = (e.bt === undefined ? 1 + Math.random() * 2 : e.bt) - dt;
        if (e.bt <= 0 && d > 170) {
          e.bt = 2.8 + Math.random();
          burst(e.x, e.y - t.cy, '#c8a0ff', 10);
          e.x += mx * 120; e.y += my * 120;
          burst(e.x, e.y - t.cy, '#c8a0ff', 10);
        }
      }
      e.x += mx * spd * dt;
      e.y += my * spd * dt;
      if (Math.abs(dx) > 2 && !(e.boss && e.ph === 'dash')) e.face = dx > 0 ? 1 : -1;
    }
    // soft separation so enemies do not stack into one blob
    for (let i = 0; i < enemies.length; i++) {
      const a = enemies[i];
      for (let j = i + 1; j < enemies.length; j++) {
        const b = enemies[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const min = a.t.r + b.t.r;
        if (Math.abs(dx) > min || Math.abs(dy) > min) continue;
        const d = Math.hypot(dx, dy);
        if (d > 0 && d < min) {
          const push = (min - d) / 2 / d;
          a.x -= dx * push; a.y -= dy * push;
          b.x += dx * push; b.y += dy * push;
        }
      }
    }
    const far = Math.hypot(W, H) + 400;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (!e.boss && Math.hypot(e.x - player.x, e.y - player.y) > far) { const p = ringPos(70); e.x = p[0]; e.y = p[1]; }
    }
  }

  // ---- weapon: auto-firing magic bolts ----
  const BOLT_SPEED = 460, BOLT_R = 6;
  const weapon = { timer: 0 };
  function nearestEnemy(maxDist) {
    let best = null, bd = maxDist * maxDist;
    for (const e of enemies) {
      const d = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }
  function burst(x, y, color, n) {
    for (let i = 0; i < (n || 10); i++) {
      const a = Math.random() * TAU, sp = 60 + Math.random() * 130;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.3 + Math.random() * 0.35, color });
    }
  }
  function hitEnemy(e, dmg, vx, vy, quiet) {
    dmg = Math.max(1, dmg - (e.t.armor || 0));
    e.hp -= dmg;
    e.flash = 0.09;
    const d = Math.hypot(vx, vy) || 1;
    const k = (e.boss ? 2 : 10) / Math.max(1, e.t.r / 12);
    if (!quiet) { e.x += vx / d * k; e.y += vy / d * k; }
    if (!quiet) {
      popups.push({ x: e.x, y: e.y - e.t.cy * 1.7, text: String(dmg), life: 0.55 });
      burst(e.x, e.y - e.t.cy, '#fff4c2', 3);
    }
  }
  function fireBolt(ox, oy, a) {
    bolts.push({
      x: ox, y: oy, vx: Math.cos(a) * BOLT_SPEED, vy: Math.sin(a) * BOLT_SPEED,
      life: S.range / BOLT_SPEED * 1.25, pierce: S.pierce, hit: new Set(),
    });
  }
  function updateWeapon(dt) {
    weapon.timer -= dt;
    if (weapon.timer <= 0) {
      const target = nearestEnemy(S.range);
      if (target) {
        const ox = player.x + player.face * 14, oy = player.y - 38;
        const base = Math.atan2(target.y - target.t.cy - oy, target.x - ox);
        for (let i = 0; i < S.count; i++) fireBolt(ox, oy, base + (i - (S.count - 1) / 2) * 0.2);
        volley++;
        if (aw.count && volley % 3 === 0) {
          for (let i = 0; i < 10; i++) fireBolt(ox, oy, base + i / 10 * TAU);
        }
        weapon.timer = S.cooldown;
      } else {
        weapon.timer = 0.1;
      }
    }
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i];
      if (aw.range || aw.bolt) { // homing
        let best = null, bd = 320 * 320;
        for (const e of enemies) {
          if (b.hit.has(e)) continue;
          const d = (e.x - b.x) ** 2 + (e.y - e.t.cy - b.y) ** 2;
          if (d < bd) { bd = d; best = e; }
        }
        if (best) {
          const cur = Math.atan2(b.vy, b.vx);
          let diff = Math.atan2(best.y - best.t.cy - b.y, best.x - b.x) - cur;
          while (diff > Math.PI) diff -= TAU;
          while (diff < -Math.PI) diff += TAU;
          const na = cur + Math.max(-6 * dt, Math.min(6 * dt, diff));
          b.vx = Math.cos(na) * BOLT_SPEED; b.vy = Math.sin(na) * BOLT_SPEED;
        }
      }
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let dead = b.life <= 0;
      for (const e of enemies) {
        if (b.hit.has(e)) continue;
        const rr = e.t.hitR + BOLT_R;
        const dx = e.x - b.x, dy = e.y - e.t.cy - b.y;
        if (dx * dx + dy * dy < rr * rr) {
          b.hit.add(e);
          hitEnemy(e, S.damage, b.vx, b.vy);
          if (aw.dmg || aw.bolt) { // explosion
            blasts.push({ x: b.x, y: b.y, t: 0, r: 70 });
            for (const o of enemies) {
              if (o === e) continue;
              const ex = o.x - b.x, ey = o.y - o.t.cy - b.y;
              if (ex * ex + ey * ey < (70 + o.t.hitR) ** 2) hitEnemy(o, Math.round(S.damage * 0.6), ex, ey, true);
            }
          }
          if (b.pierce-- <= 0) { dead = true; break; }
        }
      }
      if (dead) bolts.splice(i, 1);
    }
    if (aw.move) { // whirling barrier
      auraTimer -= dt;
      if (auraTimer <= 0) {
        auraTimer = 0.4;
        for (const e of enemies) {
          const dx = e.x - player.x, dy = e.y - player.y;
          if (dx * dx + dy * dy < (80 + e.t.r) ** 2) hitEnemy(e, Math.max(6, Math.round(S.damage * 0.5)), 0, 0, true);
        }
      }
    }
  }

  // ---- sub-weapons: missiles, lasers, bombs ----
  function explodeAt(x, y, r, dmg, ground) {
    blasts.push({ x, y, t: 0, r });
    burst(x, y, '#ffb060', 14);
    for (const e of enemies) {
      const dx = e.x - x, dy = (ground ? e.y : e.y - e.t.cy) - y;
      if (dx * dx + dy * dy < (r + (ground ? e.t.r : e.t.hitR)) ** 2) hitEnemy(e, dmg, dx, dy);
    }
  }
  function segDist(px, py, x1, y1, x2, y2) {
    const vx = x2 - x1, vy = y2 - y1, l2 = vx * vx + vy * vy || 1;
    const t = Math.max(0, Math.min(1, ((px - x1) * vx + (py - y1) * vy) / l2));
    return Math.hypot(px - (x1 + vx * t), py - (y1 + vy * t));
  }
  // Lasers leave from directly behind the hero. Each one aims at its own enemy (the nearest one
  // nobody else has picked), runs through everything on the way, then bends from enemy to enemy,
  // preferring enemies that no other laser has claimed yet.
  function laserGeom(L, claimed) {
    const ox = player.x - player.face * 16, oy = player.y - 34;
    if (L.tg) L.a = Math.atan2(L.tg.y - L.tg.t.cy - oy, L.tg.x - ox);
    const dx = Math.cos(L.a), dy = Math.sin(L.a);
    const hit = new Set(), targets = [];
    let last = null, best = -1;
    for (const e of enemies) {
      const ex = e.x - ox, ey = e.y - e.t.cy - oy;
      const along = ex * dx + ey * dy;
      if (along > 0 && along < L.len && Math.abs(ex * dy - ey * dx) < L.w / 2 + e.t.hitR * 0.8) {
        hit.add(e); targets.push([e, 1]);
        if (along > best) { best = along; last = e; }
      }
    }
    const pts = [[ox, oy], last ? [last.x, last.y - last.t.cy] : [ox + dx * L.len, oy + dy * L.len]];
    let cur = last;
    for (let c = 0; cur && c < S.las.chain; c++) {
      let nx = null;
      const cx = cur.x, cy = cur.y - cur.t.cy;
      for (let pass = 0; pass < 2 && !nx; pass++) { // pass 0 skips enemies other lasers already claimed
        let bd = 220 * 220;
        for (const e of enemies) {
          if (hit.has(e) || (pass === 0 && claimed.has(e))) continue;
          const d = (e.x - cx) ** 2 + (e.y - e.t.cy - cy) ** 2;
          if (d < bd) { bd = d; nx = e; }
        }
      }
      if (!nx) break;
      const nxx = nx.x, nxy = nx.y - nx.t.cy;
      for (const e of enemies) {
        if (hit.has(e)) continue;
        if (e === nx || segDist(e.x, e.y - e.t.cy, cx, cy, nxx, nxy) < L.w / 2 + e.t.hitR * 0.8) { hit.add(e); targets.push([e, 0.7]); }
      }
      pts.push([nxx, nxy]);
      cur = nx;
    }
    for (const e of hit) claimed.add(e);
    L.pts = pts; L.targets = targets;
  }
  function updateSkills(dt) {
    const ox = player.x, oy = player.y - 38;
    if (up.missile > 0) {
      wt.mis -= dt;
      if (wt.mis <= 0) {
        const list = enemies.filter(e => (e.x - ox) ** 2 + (e.y - player.y) ** 2 < (S.range * 1.5) ** 2)
          .sort((a, b) => ((a.x - ox) ** 2 + (a.y - oy) ** 2) - ((b.x - ox) ** 2 + (b.y - oy) ** 2));
        if (list.length) {
          for (let i = 0; i < S.mis.n; i++) {
            missiles.push({ x: ox, y: oy, a: -Math.PI / 2 + (Math.random() - 0.5) * 2.6, sp: 120, t: 0, life: 3.2, tr: 0, tg: list[i % list.length] });
          }
          wt.mis = S.mis.cd;
        } else wt.mis = 0.25;
      }
    }
    for (let i = missiles.length - 1; i >= 0; i--) {
      const m = missiles[i];
      m.t += dt; m.life -= dt;
      if (!m.tg || m.tg.hp <= 0 || !enemies.includes(m.tg)) {
        m.tg = null;
        let bd = 700 * 700;
        for (const e of enemies) {
          const d = (e.x - m.x) ** 2 + (e.y - e.t.cy - m.y) ** 2;
          if (d < bd) { bd = d; m.tg = e; }
        }
      }
      if (m.tg) {
        let diff = Math.atan2(m.tg.y - m.tg.t.cy - m.y, m.tg.x - m.x) - m.a;
        while (diff > Math.PI) diff -= TAU;
        while (diff < -Math.PI) diff += TAU;
        const turn = Math.min(1, m.t * 3) * 5 * dt;
        m.a += Math.max(-turn, Math.min(turn, diff));
      }
      m.sp = Math.min(430, m.sp + 520 * dt);
      m.x += Math.cos(m.a) * m.sp * dt; m.y += Math.sin(m.a) * m.sp * dt;
      m.tr -= dt;
      if (m.tr <= 0) {
        m.tr = 0.025;
        particles.push({ x: m.x - Math.cos(m.a) * 9, y: m.y - Math.sin(m.a) * 9, vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30, life: 0.28, color: '#ff9a40' });
      }
      let boom = m.life <= 0;
      if (!boom) for (const e of enemies) {
        const dx = e.x - m.x, dy = e.y - e.t.cy - m.y, rr = e.t.hitR + 7;
        if (dx * dx + dy * dy < rr * rr) { boom = true; break; }
      }
      if (boom) { explodeAt(m.x, m.y, S.mis.r, S.mis.dmg, false); missiles.splice(i, 1); }
    }

    if (up.laser > 0) {
      wt.las -= dt;
      if (wt.las <= 0) {
        const range2 = (S.range * 1.8) ** 2;
        const list = enemies.filter(e => (e.x - player.x) ** 2 + (e.y - player.y) ** 2 < range2)
          .sort((a, b) => ((a.x - player.x) ** 2 + (a.y - player.y) ** 2) - ((b.x - player.x) ** 2 + (b.y - player.y) ** 2));
        if (list.length) {
          for (let i = 0; i < S.las.n; i++) {
            lasers.push({ tg: list[i % list.length], a: 0, t: 0, dur: S.las.dur, tick: 0, w: S.las.w, len: 720 });
          }
          wt.las = S.las.cd;
        } else wt.las = 0.3;
      }
    }
    if (lasers.length) {
      const claimed = new Set();
      for (const L of lasers) if (L.tg) claimed.add(L.tg);
      for (let i = lasers.length - 1; i >= 0; i--) {
        const L = lasers[i];
        L.t += dt; L.tick -= dt;
        if (!L.tg || L.tg.hp <= 0 || !enemies.includes(L.tg)) { // lost its target: take the nearest unclaimed enemy
          let best = null, bd = 1e12, any = null, ad = 1e12;
          for (const e of enemies) {
            const d = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
            if (d < ad) { ad = d; any = e; }
            if (!claimed.has(e) && d < bd) { bd = d; best = e; }
          }
          L.tg = best || any;
          if (L.tg) claimed.add(L.tg);
        }
        laserGeom(L, claimed);
        if (L.tick <= 0) {
          L.tick = 0.12;
          for (const [e, m] of L.targets) hitEnemy(e, Math.round(S.las.dmg * m), 0, 0, true);
        }
        if (L.t >= L.dur) lasers.splice(i, 1);
      }
    }

    if (up.bomb > 0) {
      wt.bmb -= dt;
      if (wt.bmb <= 0) {
        if (enemies.some(e => (e.x - player.x) ** 2 + (e.y - player.y) ** 2 < (S.range * 1.1) ** 2)) {
          for (let i = 0; i < S.bmb.n; i++) {
            bombs.push({
              x: player.x + (i ? (Math.random() - 0.5) * 100 : 0), y: player.y + 4 + (i ? (Math.random() - 0.5) * 70 : 0),
              t: 0, fuse: 1 + i * 0.15, r: S.bmb.r, dmg: S.bmb.dmg, chain: true,
            });
          }
          wt.bmb = S.bmb.cd;
        } else wt.bmb = 0.3;
      }
    }
    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i];
      b.t += dt;
      if (b.t >= b.fuse) {
        explodeAt(b.x, b.y - 6, b.r, b.dmg, true);
        if (aw.bomb && b.chain) {
          for (let k = 0; k < 3; k++) {
            const a = Math.random() * TAU;
            bombs.push({ x: b.x + Math.cos(a) * 70, y: b.y + Math.sin(a) * 50, t: 0, fuse: 0.35 + k * 0.15, r: b.r * 0.6, dmg: Math.round(b.dmg * 0.6), chain: false });
          }
        }
        bombs.splice(i, 1);
      }
    }
  }

  function reap() {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.hp <= 0) {
        kills++;
        burst(e.x, e.y - e.t.cy, e.t.color, e.boss ? 60 : 12);
        if (e.boss) {
          for (let k = 0; k < 14; k++) {
            const a = Math.random() * TAU, r = 20 + Math.random() * 50;
            gems.push({ x: e.x + Math.cos(a) * r, y: e.y + Math.sin(a) * r * 0.6, v: 5, ph: Math.random() * TAU, s: 0, mag: false });
          }
          chests.push({ x: e.x, y: e.y, ph: Math.random() * TAU });
          hearts.push({ x: e.x - 30, y: e.y + 10, ph: 0 }, { x: e.x + 30, y: e.y + 10, ph: 1 });
          magnets.push({ x: e.x, y: e.y + 24, ph: 2 });
        } else {
          gems.push({ x: e.x, y: e.y - 2, v: e.t.xp, ph: Math.random() * TAU, s: 0, mag: false });
          if (Math.random() < 0.03) hearts.push({ x: e.x, y: e.y - 2, ph: Math.random() * TAU });
          if (Math.random() < 0.012) magnets.push({ x: e.x, y: e.y - 2, ph: Math.random() * TAU });
        }
        enemies.splice(i, 1);
      }
    }
  }

  function updateChests() {
    for (let i = chests.length - 1; i >= 0; i--) {
      const c = chests[i];
      if (Math.hypot(player.x - c.x, player.y - c.y) < 30) {
        chests.splice(i, 1);
        burst(c.x, c.y - 14, '#ffd24a', 30);
        pendingAwaken++;
      }
    }
    if ((pending > 0 || pendingAwaken > 0) && state === 'playing') nextScreen();
  }

  function updateGems(dt) {
    for (let i = gems.length - 1; i >= 0; i--) {
      const g = gems[i];
      const dx = player.x - g.x, dy = (player.y - 10) - g.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d < S.magnet) g.mag = true;
      if (g.mag) {
        g.s = Math.min(g.s + 1000 * dt, 640);
        g.x += dx / d * g.s * dt; g.y += dy / d * g.s * dt;
      }
      if (d < 18) { addXp(g.v); gems.splice(i, 1); }
    }
    while (gems.length > 300) { const g = gems.shift(); addXp(g.v); }
  }

  function updateFx(dt) {
    shake = Math.max(0, shake - dt * 40);
    hitFlash = Math.max(0, hitFlash - dt * 2.5);
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      p.vx *= 0.92; p.vy *= 0.92;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].y -= 30 * dt; popups[i].life -= dt;
      if (popups[i].life <= 0) popups.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].t += dt;
      if (rings[i].t > 0.7) rings.splice(i, 1);
    }
    for (let i = blasts.length - 1; i >= 0; i--) {
      blasts[i].t += dt;
      if (blasts[i].t > 0.35) blasts.splice(i, 1);
    }
    bannerT = Math.max(0, bannerT - dt);
    waveBannerT = Math.max(0, waveBannerT - dt);
  }

  // ---- player health, contact damage, game over ----
  function shockwave() {
    blasts.push({ x: player.x, y: player.y - 20, t: 0, r: 300 });
    rings.push({ t: 0 });
    burst(player.x, player.y - 30, '#ffe9b0', 40);
    for (const e of enemies) {
      const dx = e.x - player.x, dy = e.y - player.y;
      if (dx * dx + dy * dy < 330 * 330) hitEnemy(e, 300, dx, dy);
    }
    popups.push({ x: player.x, y: player.y - 70, text: '蘇生！', life: 1.2, color: '#ffe9b0' });
  }
  function gameOver() {
    state = 'dead'; deadT = 0; stick.active = false;
    burst(player.x, player.y - 30, '#ffb347', 40);
    burst(player.x, player.y - 30, '#ff4f7a', 30);
    try {
      const best = JSON.parse(localStorage.getItem('hollownight.best') || 'null') || { time: 0, kills: 0 };
      best.time = Math.max(best.time, Math.floor(time)); best.kills = Math.max(best.kills, kills); best.wave = Math.max(best.wave || 0, wave);
      localStorage.setItem('hollownight.best', JSON.stringify(best));
    } catch (e) { /* storage unavailable */ }
  }
  function hurt(e, dx, dy) {
    const dmg = Math.max(1, Math.round(e.t.dmg * (1 + (wave - 1) * 0.12)));
    hp -= dmg;
    invuln = 0.7; shake = 9; hitFlash = 0.35;
    const d = Math.hypot(dx, dy) || 1;
    player.x += dx / d * 16; player.y += dy / d * 16;
    if (!e.boss) { e.x -= dx / d * 10; e.y -= dy / d * 10; }
    popups.push({ x: player.x, y: player.y - 62, text: '-' + dmg, life: 0.7, color: '#ff6a8a' });
    burst(player.x, player.y - 30, '#ff4f7a', 12);
    if (hp <= 0) {
      if (aw.vit && !revived) { revived = true; hp = S.maxHp; invuln = 2.5; shockwave(); }
      else { hp = 0; gameOver(); }
    }
  }
  function updateContact(dt) {
    invuln = Math.max(0, invuln - dt);
    hp = Math.min(S.maxHp, hp + (0.4 + 0.2 * up.vit) * dt);
    if (invuln > 0) return;
    for (const e of enemies) {
      const dx = player.x - e.x, dy = player.y - e.y, rr = e.t.r + 11;

  function updateMagnets(dt) { // an XP magnet pulls every gem on the field to the hero
    for (let i = magnets.length - 1; i >= 0; i--) {
      const m = magnets[i];
      const dx = player.x - m.x, dy = (player.y - 10) - m.y, d = Math.hypot(dx, dy) || 1;
      if (d < 70) { m.x += dx / d * 260 * dt; m.y += dy / d * 260 * dt; }
      if (d < 26) {
        for (const g of gems) { g.mag = true; g.s = Math.max(g.s, 350); }
        popups.push({ x: player.x, y: player.y - 62, text: '全経験値を回収！', life: 1.2, color: '#ffd84a' });
        burst(m.x, m.y - 10, '#ffd84a', 24);

        magnets.splice(i, 1);

  }
  function updateHearts(dt) {
    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      const dx = player.x - h.x, dy = (player.y - 10) - h.y, d = Math.hypot(dx, dy) || 1;
      if (d < 70) { h.x += dx / d * 260 * dt; h.y += dy / d * 260 * dt; }
      if (d < 22) {
        const heal = Math.min(20, S.maxHp - hp);
        hp += heal;
        popups.push({ x: player.x, y: player.y - 62, text: '+' + Math.round(heal), life: 0.7, color: '#6fffd0' });

        hearts.splice(i, 1);

  }
  function resetGame() {
    state = 'playing';
    time = Number(params.get('t')) || 0;
    player.x = 0; player.y = 0; player.face = 1; player.walk = 0; player.moving = false;
    cam.x = 0; cam.y = 0;

    level = 1; xp = 0; pending = 0; pendingAwaken = 0;
    for (const k in up) up[k] = 0;

    choices = []; mode = 'level'; levelupDelay = 0;
    invuln = 0; hitFlash = 0; shake = 0; deadT = 0; revived = false;

  function update(dt) {
    clock += dt;
    if (state === 'dead') { deadT += dt; updateFx(dt); return; }
    if (state === 'levelup') {
      levelupDelay = Math.max(0, levelupDelay - dt);
      updateFx(dt);
      return;
    }
    time += dt;
    const v = getInput();
    player.x += v.x * player.speed * dt;
    player.y += v.y * player.speed * dt;
    if (v.x > 0.1) player.face = 1; else if (v.x < -0.1) player.face = -1;
    player.moving = !!(v.x || v.y);
    player.walk = player.moving ? player.walk + dt * 11 : 0;
    cam.x = player.x;
    cam.y = player.y;
    updateEnemies(dt);
    updateWeapon(dt);
    updateSkills(dt);
    reap();
    updateContact(dt);
    if (state === 'dead') { updateFx(dt); return; }
    updateHearts(dt);
    updateMagnets(dt);
    updateGems(dt);
    updateChests();
    updateFx(dt);
  }

  // =====================================================================
  // Rendering
  // =====================================================================
  let devTiles = null, devDpr = 0;
  function drawGround() {
    if (!devTiles || devDpr !== dpr) { // tiles resampled once to the exact device size, so drawing is a plain blit
      const n = Math.round(TILE * dpr);
      devTiles = tiles.map(src => { const c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(src, 0, 0, n, n); return c; });
      devDpr = dpr;
    }
    const n = Math.round(TILE * dpr);
    const tx0 = Math.floor(camL / TILE), ty0 = Math.floor(camT / TILE);
    const tx1 = Math.floor((camL + W) / TILE), ty1 = Math.floor((camT + H) / TILE);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const v = Math.floor(hash(tx, ty, 1) * devTiles.length);
        ctx.drawImage(devTiles[v], Math.round((tx * TILE - camL) * dpr), Math.round((ty * TILE - camT) * dpr));
      }
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const shadowTex = mk(64, 32, g => { g.fillStyle = 'rgb(20,56,34)'; g.beginPath(); g.ellipse(32, 16, 31, 15, 0, 0, TAU); g.fill(); });
  function shadow(x, y, rx, ry, a) {
    ctx.globalAlpha = a * 0.85;
    ctx.drawImage(shadowTex, x - rx, y - ry, rx * 2, ry * 2);
    ctx.globalAlpha = 1;
  }

  const items = [];
  function drawWorld() {
    items.length = 0;
    // ground decals
    const dx0 = Math.floor((camL - 130) / DCELL), dx1 = Math.floor((camL + W + 130) / DCELL);
    const dy0 = Math.floor((camT - 100) / DCELL), dy1 = Math.floor((camT + H + 100) / DCELL);
    for (let cy = dy0; cy <= dy1; cy++) {
      for (let cx = dx0; cx <= dx1; cx++) {
        const d = decalAt(cx, cy);
        if (!d) continue;
        const k = DECALS[d.k];
        ctx.drawImage(k.s, d.x - camL - k.w / 2, d.y - camT - k.h / 2, k.w, k.h);
      }
    }
    // decor
    const cx0 = Math.floor((camL - 110) / CELL), cx1 = Math.floor((camL + W + 110) / CELL);
    const cy0 = Math.floor((camT - 30) / CELL), cy1 = Math.floor((camT + H + 180) / CELL);
    for (let cy = cy0; cy <= cy1; cy++) {
      for (let cx = cx0; cx <= cx1; cx++) {
        const d = decorAt(cx, cy);
        if (!d) continue;
        const k = DEC[d.k];
        if (k.sh) shadow(d.x - camL + k.sh[2], d.y - camT + 2, k.sh[0], k.sh[1], 0.3);
        if (k.light) { // soft pool of light on the ground
          const lx = d.x - camL, ly = d.y - camT + 4, pulse = 1 + 0.08 * Math.sin(clock * 3 + d.x);
          ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(lx, ly); ctx.scale(1, 0.62);
          ctx.fillStyle = rg(ctx, 0, 0, 0, 0, 0, k.light[1], [[0, `rgba(${k.light[0]},${k.light[2] * pulse})`], [1, `rgba(${k.light[0]},0)`]]);
          ctx.fillRect(-k.light[1], -k.light[1], k.light[1] * 2, k.light[1] * 2);
          ctx.restore();
        }
        items.push({ y: d.y, t: 0, d, k });
      }
    }
    // gems (on the ground)
    for (const g of gems) {
      const sx = g.x - camL, sy = g.y - camT;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      shadow(sx, sy + 2, 5, 2, 0.25);
      const spr = gemSpr[g.v >= 5 ? 2 : g.v >= 2 ? 1 : 0];
      const bob = Math.sin(clock * 4 + g.ph) * 2;
      ctx.drawImage(spr, sx - 14, sy - 22 + bob, 28, 28);
      const sp = 0.5 + 0.5 * Math.sin(clock * 5 + g.ph), r = 2.5 + 3 * sp;
      ctx.fillStyle = `rgba(255,255,255,${0.4 + 0.55 * sp})`; // a sharp four-point sparkle, nothing in the scenery looks like it
      ctx.beginPath(); ctx.moveTo(sx + 8, sy - 24 + bob - r); ctx.lineTo(sx + 8 + r * 0.3, sy - 24 + bob - r * 0.3); ctx.lineTo(sx + 8 + r, sy - 24 + bob);
      ctx.lineTo(sx + 8 + r * 0.3, sy - 24 + bob + r * 0.3); ctx.lineTo(sx + 8, sy - 24 + bob + r); ctx.lineTo(sx + 8 - r * 0.3, sy - 24 + bob + r * 0.3);
      ctx.lineTo(sx + 8 - r, sy - 24 + bob); ctx.lineTo(sx + 8 - r * 0.3, sy - 24 + bob - r * 0.3); ctx.closePath(); ctx.fill();
    }
    for (const h of hearts) {
      const sx = h.x - camL, sy = h.y - camT;
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) continue;
      shadow(sx, sy + 2, 5, 2, 0.25);
      ctx.drawImage(heartSpr, sx - 14, sy - 24 + Math.sin(clock * 3 + h.ph) * 2.5, 28, 28);
    }
    for (const m of magnets) {
      const sx = m.x - camL, sy = m.y - camT;
      if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;
      const bob = Math.sin(clock * 3 + m.ph) * 3;
      shadow(sx, sy + 2, 8, 3, 0.28);
      ctx.strokeStyle = `rgba(255,200,60,${0.5 + 0.4 * Math.sin(clock * 6)})`; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(sx, sy - 16 + bob, 18 + 3 * Math.sin(clock * 6), 0, TAU); ctx.stroke();
      ctx.drawImage(magnetSpr, sx - 17, sy - 33 + bob, 34, 34);
    }
    // treasure chests with a light beam
    for (const c of chests) {
      const sx = c.x - camL, sy = c.y - camT;
      shadow(sx, sy + 2, 18, 6, 0.3);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = lg(ctx, 0, sy - 260, 0, sy, [[0, 'rgba(255,220,110,0)'], [1, 'rgba(255,220,110,0.35)']]);

    }
    // enemy + player shadows
    for (const e of enemies) {
      const sx = e.x - camL, sy = e.y - camT;
      if (sx < -70 || sx > W + 70 || sy < -70 || sy > H + 90) continue;
      const k = e.t.fly ? 0.75 : 1;
      shadow(sx, sy + 2, e.t.sh * k, e.t.sh * 0.34 * k, 0.3);
      items.push({ y: e.y, t: 1, e });
    }
    const px = player.x - camL, py = player.y - camT;
    shadow(px, py + 2, 13, 4.5, 0.32);
    items.push({ y: player.y, t: 2 });
    for (const b of bombs) items.push({ y: b.y, t: 3, b });
    items.sort((a, b) => a.y - b.y);

    for (const it of items) {
      if (it.t === 0) {
        const { d, k } = it;
        ctx.drawImage(k.s, d.x - camL - k.ax, d.y - camT - k.ay, k.w, k.h);

      }
    }
  }

  // rune mine: a dark hexagonal disc with an amber glyph
  const bombSpr = mk(32, 34, g => {

    for (let i = 0; i < 6; i++) { const a = i * TAU / 6 - Math.PI / 2; g.lineTo(16 + Math.cos(a) * 12, 20 + Math.sin(a) * 12); }

    g.strokeStyle = '#ffb347'; g.lineWidth = 1.4;
    g.beginPath();
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6 - Math.PI / 2; g.lineTo(16 + Math.cos(a) * 7, 20 + Math.sin(a) * 7); }

    line(g, [[16, 14], [16, 26]], '#ffcf7a', 1.4); line(g, [[10.5, 17], [21.5, 23]], '#ffcf7a', 1.2); line(g, [[10.5, 23], [21.5, 17]], '#ffcf7a', 1.2);
  });
  function drawBomb(b) {
    const sx = b.x - camL, sy = b.y - camT, k = b.t / b.fuse;
    shadow(sx, sy + 2, 10, 3.5, 0.3);
    const blink = (Math.sin(b.t * (14 + 24 * k)) + 1) / 2;
    const s = 1 + 0.06 * blink;
    ctx.save();
    ctx.translate(sx, sy + 4);
    ctx.scale(s, s);

  function drawEnemy(e) {
    const t = e.t;
    const f = ((time * 5 + e.phase) | 0) & 1;
    const lift = t.fly ? Math.sin(time * 4 + e.phase) * 2.5 : 0;
    const sx = e.x - camL, sy = e.y - camT + lift;
    if (e.boss) {
      const p = 0.8 + 0.2 * Math.sin(clock * 4);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rg(ctx, sx, sy - t.cy, 10, sx, sy - t.cy, 100, [[0, `rgba(255,60,120,${0.34 * p})`], [1, 'rgba(255,60,120,0)']]);
      ctx.fillRect(sx - 100, sy - t.cy - 100, 200, 200);
      ctx.restore();

    const right = e.face > 0;
    const x0 = sx - (right ? t.ax : t.w - t.ax), y0 = sy - t.ay;
    ctx.drawImage((right ? t.spr : t.sprF)[f], x0, y0, t.w, t.h);

  function drawPlayer() {
    const px = player.x - camL, py = player.y - camT;

    const frame = player.moving ? (Math.floor(player.walk) % 4) : 0;
    const breathe = player.moving ? 0 : Math.sin(clock * 3) * 0.8;

      const p = 0.65 + 0.35 * Math.sin(clock * 6);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rg(ctx, ex, ey, 0, ex, ey, active ? 26 : 16, [[0, `rgba(140,245,255,${(active ? 0.9 : 0.45) * p})`], [1, 'rgba(60,200,255,0)']]);

    ctx.fillStyle = rg(ctx, gx, gy, 0, gx, gy, 12, [[0, `rgba(255,200,90,${0.5 * pulse})`], [1, 'rgba(255,150,40,0)']]);

    }
    for (const m of missiles) {
      const tx = m.x - camL - Math.cos(m.a) * 11, ty = m.y - camT - Math.sin(m.a) * 11;

    // bolt colours change with awakenings
    const pal = aw.bolt ? ['255,240,170', '255,170,70', '#ffffff'] : aw.dmg ? ['255,110,50', '255,60,20', '#ffe0c0']

      : ['255,225,130', '255,140,30', '#fff8d6'];
    const trail = aw.bolt ? '255,210,100' : aw.dmg ? '255,120,40' : aw.range ? '90,200,255' : '255,190,70';
    const size = aw.bolt ? 1.6 : aw.dmg ? 1.3 : 1;
    for (const b of bolts) {

    for (const m of missiles) {
      ctx.save();
      ctx.translate(m.x - camL, m.y - camT);
      ctx.rotate(m.a);

      ctx.fillStyle = lg(ctx, 0, -3.4, 0, 3.4, [[0, '#ffffff'], [1, '#9aa0ac']]); ctx.fill();
      ctx.strokeStyle = '#2a2d38'; ctx.lineWidth = 1.2; ctx.stroke();
      poly(ctx, [[6, -3.4], [13, 0], [6, 3.4]], '#e8483a', '#2a0a0a', 1);
      ctx.restore();
    }
    // level-up rings
    for (const r of rings) {
      const k = r.t / 0.7;
      ctx.strokeStyle = `rgba(255,220,110,${1 - k})`;
      ctx.lineWidth = 6 * (1 - k) + 1;
      ctx.beginPath();

      ctx.strokeText(p.text, p.x - camL, p.y - camT);
      ctx.fillText(p.text, p.x - camL, p.y - camT);
    }
    ctx.globalAlpha = 1;
  }

  // ---- UI skin: slim glass, hexagon badges, chamfered panels ----
  // ---- hand-drawn skill emblems (drawn in a -1..1 box, scaled by r) ----
  function drawSkillIcon(c, id, x, y, r, col) {
    c.save(); c.translate(x, y); c.scale(r, r);
    c.lineCap = 'round'; c.lineJoin = 'round';
    const W_ = '#ffffff';
    const path = pts => { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); };

    const stroke = (pts, w, s) => { path(pts); c.lineWidth = w; c.strokeStyle = s; c.stroke(); };
    const dot = (px, py, pr, fill) => { c.beginPath(); c.arc(px, py, pr, 0, TAU); c.fillStyle = fill; c.fill(); };
    const bullet = (bx, by, s, rot) => {
      c.save(); c.translate(bx, by); c.rotate(rot); c.scale(s, s);

      c.beginPath(); c.moveTo(0.2, -0.2); c.quadraticCurveTo(0.7, -0.15, 0.8, 0); c.quadraticCurveTo(0.7, 0.15, 0.2, 0.2); c.closePath(); c.fillStyle = W_; c.fill();
      poly([[-0.2, -0.2], [-0.08, -0.2], [-0.08, 0.2], [-0.2, 0.2]], 'rgba(0,0,0,0.3)');
      c.restore();
    };
    switch (id) {
      case 'bolt': // a bullet with a speed trail

        bullet(0.1, 0, 1.15, 0);
        break;
      case 'dmg': { // flame
        c.beginPath(); c.moveTo(0, -0.95); c.bezierCurveTo(0.2, -0.5, 0.75, -0.2, 0.65, 0.35); c.bezierCurveTo(0.6, 0.8, 0.2, 0.95, 0, 0.95);
        c.bezierCurveTo(-0.2, 0.95, -0.62, 0.8, -0.65, 0.35); c.bezierCurveTo(-0.7, -0.05, -0.35, -0.2, -0.28, -0.55); c.bezierCurveTo(-0.1, -0.35, 0, -0.5, 0, -0.95); c.closePath();
        c.fillStyle = col; c.fill();
        c.beginPath(); c.moveTo(0, -0.1); c.bezierCurveTo(0.12, 0.15, 0.38, 0.3, 0.3, 0.6); c.bezierCurveTo(0.25, 0.85, 0.08, 0.88, 0, 0.88);
        c.bezierCurveTo(-0.08, 0.88, -0.28, 0.85, -0.3, 0.6); c.bezierCurveTo(-0.34, 0.35, -0.05, 0.2, 0, -0.1); c.closePath();
        c.fillStyle = W_; c.fill();
        break; }
      case 'rate': // lightning
        poly([[0.25, -0.95], [-0.55, 0.1], [-0.05, 0.1], [-0.28, 0.95], [0.6, -0.2], [0.08, -0.2]], col);
        stroke([[0.25, -0.95], [-0.55, 0.1], [-0.05, 0.1], [-0.28, 0.95]], 0.06, 'rgba(255,255,255,0.85)');
        break;
      case 'count': // three bullets in a fan
        bullet(-0.58, 0.55, 0.85, -Math.PI / 2 - 0.3); bullet(0, 0.4, 0.85, -Math.PI / 2); bullet(0.58, 0.55, 0.85, -Math.PI / 2 + 0.3);
        break;
      case 'pierce': // a round punching through two plates
        for (const px of [-0.15, 0.4]) { poly([[px - 0.1, -0.8], [px + 0.1, -0.8], [px + 0.1, -0.2], [px - 0.1, -0.2]], col); poly([[px - 0.1, 0.2], [px + 0.1, 0.2], [px + 0.1, 0.8], [px - 0.1, 0.8]], col); }
        stroke([[-0.95, 0], [-0.1, 0]], 0.1, 'rgba(255,255,255,0.5)');
        bullet(0.45, 0, 1.0, 0);
        stroke([[0.85, -0.35], [0.95, -0.55]], 0.08, W_); stroke([[0.9, 0], [1.0, 0]], 0.08, W_);
        break;
      case 'move': // three speed chevrons
        for (let i = 0; i < 3; i++) stroke([[-0.75 + i * 0.5, -0.6], [-0.25 + i * 0.5, 0], [-0.75 + i * 0.5, 0.6]], 0.22, i === 2 ? W_ : col);
        break;
      case 'magnet': { // horseshoe magnet
        c.lineWidth = 0.36; c.strokeStyle = col; c.beginPath(); c.moveTo(-0.55, -0.7); c.lineTo(-0.55, 0.1); c.arc(0, 0.1, 0.55, Math.PI, 0, true); c.lineTo(0.55, -0.7); c.stroke();
        poly([[-0.73, -0.78], [-0.37, -0.78], [-0.37, -0.45], [-0.73, -0.45]], W_); poly([[0.37, -0.78], [0.73, -0.78], [0.73, -0.45], [0.37, -0.45]], W_);
        stroke([[-0.2, -0.95], [-0.1, -0.7]], 0.07, W_); stroke([[0.2, -0.95], [0.1, -0.7]], 0.07, W_);
        break; }
      case 'range': // scope reticle
        c.lineWidth = 0.12; c.strokeStyle = col; c.beginPath(); c.arc(0, 0, 0.62, 0, TAU); c.stroke();
        for (const [a, b, d, e] of [[0, -0.98, 0, -0.3], [0, 0.98, 0, 0.3], [-0.98, 0, -0.3, 0], [0.98, 0, 0.3, 0]]) stroke([[a, b], [d, e]], 0.12, col);
        dot(0, 0, 0.12, W_);
        break;
      case 'vit': // heart with a pulse
        c.beginPath(); c.moveTo(0, 0.85); c.bezierCurveTo(-1.05, 0.15, -0.85, -0.75, -0.35, -0.7); c.bezierCurveTo(-0.12, -0.68, 0, -0.5, 0, -0.35);
        c.bezierCurveTo(0, -0.5, 0.12, -0.68, 0.35, -0.7); c.bezierCurveTo(0.85, -0.75, 1.05, 0.15, 0, 0.85); c.closePath(); c.fillStyle = col; c.fill();
        stroke([[-0.55, 0.05], [-0.2, 0.05], [-0.08, -0.25], [0.12, 0.35], [0.24, 0.05], [0.55, 0.05]], 0.1, W_);
        break;
      case 'missile': // diagonal missile with a flame
        c.rotate(-Math.PI / 4);
        poly([[-0.95, 0], [-0.55, -0.16], [-0.55, 0.16]], 'rgba(255,200,80,0.95)');
        poly([[-0.5, -0.2], [0.4, -0.2], [0.4, 0.2], [-0.5, 0.2]], W_);
        poly([[0.4, -0.2], [0.95, 0], [0.4, 0.2]], col);
        poly([[-0.5, -0.2], [-0.8, -0.55], [-0.2, -0.2]], col); poly([[-0.5, 0.2], [-0.8, 0.55], [-0.2, 0.2]], col);
        poly([[0.0, -0.2], [0.14, -0.2], [0.14, 0.2], [0.0, 0.2]], col);
        break;
      case 'laser': // a beam that bends from node to node
        stroke([[-0.85, 0.65], [-0.2, 0.05], [0.25, 0.5], [0.85, -0.55]], 0.3, col);
        stroke([[-0.85, 0.65], [-0.2, 0.05], [0.25, 0.5], [0.85, -0.55]], 0.1, W_);
        for (const [px, py] of [[-0.2, 0.05], [0.25, 0.5]]) { dot(px, py, 0.2, col); dot(px, py, 0.1, W_); }
        break;
      case 'bomb': // round bomb with a lit fuse
        dot(-0.05, 0.2, 0.62, col); dot(-0.25, -0.02, 0.17, 'rgba(255,255,255,0.65)');
        poly([[-0.2, -0.46], [0.18, -0.46], [0.14, -0.28], [-0.16, -0.28]], W_);
        c.beginPath(); c.moveTo(0, -0.46); c.quadraticCurveTo(0.12, -0.8, 0.45, -0.78); c.lineWidth = 0.1; c.strokeStyle = W_; c.stroke();
        poly([[0.45, -0.98], [0.52, -0.82], [0.68, -0.78], [0.52, -0.72], [0.45, -0.58], [0.38, -0.72], [0.22, -0.78], [0.38, -0.82]], '#ffd84a');
        break;
      default:
        dot(0, 0, 0.5, col);
    }
    c.restore();
  }

  function hexPath(c, x, y, r) {
    c.beginPath();
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6 - Math.PI / 2; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
    c.closePath();
  }
  function chamfer(c, x, y, w, h, k) {
    c.beginPath();
    c.moveTo(x + k, y); c.lineTo(x + w, y); c.lineTo(x + w, y + h - k); c.lineTo(x + w - k, y + h);
    c.lineTo(x, y + h); c.lineTo(x, y + k); c.closePath();
  }
  function spaced(px) { try { ctx.letterSpacing = px + 'px'; } catch (e) { /* older browsers */ } }
  const textCache = new Map();
  function tag(text, x, y, align, size, fill) {
    const ls = ctx.letterSpacing || '0px', col = fill || '#dff3ff';
    const key = text + '|' + size + '|' + col + '|' + ls;
    let e = textCache.get(key);
    if (!e) {
      if (textCache.size > 300) textCache.clear();
      ctx.font = `bold ${size}px ${FONT}`;
      const w = Math.ceil(ctx.measureText(text).width) + 12, h = size + 12, q = 2;
      const c = document.createElement('canvas'); c.width = w * q; c.height = h * q;
      const g = c.getContext('2d'); g.scale(q, q);
      try { g.letterSpacing = ls; } catch (err) { /* ignore */ }
      g.font = `bold ${size}px ${FONT}`; g.textAlign = 'left';
      g.lineWidth = 3; g.strokeStyle = 'rgba(2,6,14,0.85)'; g.lineJoin = 'round';
      g.strokeText(text, 6, size + 3); g.fillStyle = col; g.fillText(text, 6, size + 3);
      e = { c, w, h, base: size + 3 }; textCache.set(key, e);
    }
    const dx = align === 'left' ? x - 6 : align === 'right' ? x - e.w + 6 : x - e.w / 2;
    ctx.drawImage(e.c, dx, y - e.base, e.w, e.h);
  }

  function drawHud() {
    const top = safeTop + 12;
    const bx = 14, bw = W - 28;
    // experience: a slim bar with a hexagon level badge
    const by = top + 9, bh = 7;
    ctx.fillStyle = 'rgba(8,16,28,0.7)';
    ctx.fillRect(bx + 14, by, bw - 14, bh);
    const frac = Math.min(1, xp / xpNeed(level));
    if (frac > 0) {
      const fw = (bw - 14) * frac;
      ctx.fillStyle = lg(ctx, bx, 0, bx + bw, 0, [[0, '#2fe0c0'], [1, '#6a9cff']]);
      ctx.fillRect(bx + 14, by, fw, bh);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rg(ctx, bx + 14 + fw, by + bh / 2, 0, bx + 14 + fw, by + bh / 2, 14, [[0, 'rgba(120,255,230,0.7)'], [1, 'rgba(120,255,230,0)']]);
      ctx.fillRect(bx + fw, by - 8, 28, 24);
      ctx.restore();
    }
    ctx.strokeStyle = 'rgba(160,215,255,0.35)'; ctx.lineWidth = 1;
    ctx.strokeRect(bx + 14.5, by + 0.5, bw - 15, bh - 1);
    hexPath(ctx, bx + 12, by + bh / 2, 15);
    ctx.fillStyle = '#0b1424'; ctx.fill();
    ctx.strokeStyle = '#6fe8d4'; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = `800 ${level >= 100 ? 10 : 13}px ${FONT}`;
    ctx.fillStyle = '#e8fffb';
    ctx.fillText(level, bx + 12, by + bh / 2 + 4.6);

    // health: a slim bar under the experience bar
    const hy = by + bh + 5, hh = 6, hf = Math.max(0, hp / S.maxHp);
    ctx.fillStyle = 'rgba(34,6,18,0.78)'; ctx.fillRect(bx + 14, hy, bw - 14, hh);
    ctx.fillStyle = hf < 0.3 && Math.sin(clock * 8) > 0 ? '#ff2a4a' : lg(ctx, bx, 0, bx + bw, 0, [[0, '#ff4f7a'], [1, '#ff9a6a']]);
    ctx.fillRect(bx + 14, hy, (bw - 14) * hf, hh);
    ctx.strokeStyle = 'rgba(255,170,200,0.4)'; ctx.lineWidth = 1;
    ctx.strokeRect(bx + 14.5, hy + 0.5, bw - 15, hh - 1);

    // kills (left) and survival time (right), small and quiet
    const y = by + 52;
    spaced(1);
    tag('撃破 ' + kills, bx + 2, y, 'left', 14);
    tag('HP ' + Math.ceil(hp) + ' / ' + S.maxHp, W / 2, y, 'center', 12, '#ffb0c4');
    const mm = String(Math.floor(time / 60)).padStart(2, '0'), ss = String(Math.floor(time % 60)).padStart(2, '0');
    tag(mm + ':' + ss, W - bx - 2, y, 'right', 15);
    spaced(0);

    // skill badges: hexagon frames (gold double frame = awakened, white = max level)
    let cx = bx + 14;
    const cyc = y + 26;
    for (const u of UPGRADES) {
      if (!up[u.id]) continue;
      const done = aw[u.id], max = up[u.id] >= u.max;
      if (done) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = rg(ctx, cx, cyc, 0, cx, cyc, 22, [[0, 'rgba(255,200,90,0.55)'], [1, 'rgba(255,200,90,0)']]);
        ctx.fillRect(cx - 22, cyc - 22, 44, 44);
        ctx.restore();
      }
      hexPath(ctx, cx, cyc, 13);
      ctx.fillStyle = 'rgba(8,14,26,0.82)'; ctx.fill();
      ctx.strokeStyle = done ? '#ffc65a' : max ? '#ffffff' : u.color; ctx.lineWidth = done ? 2.6 : 1.8; ctx.stroke();
      if (done) { hexPath(ctx, cx, cyc, 9); ctx.strokeStyle = 'rgba(255,198,90,0.6)'; ctx.lineWidth = 1; ctx.stroke(); }
      drawSkillIcon(ctx, u.id, cx, cyc, 8.2, done ? '#ffd88a' : u.color);
      if (!done) {
        ctx.font = `bold 9px ${FONT}`;
        ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.fillStyle = '#fff';
        ctx.strokeText(up[u.id], cx + 11, cyc + 16); ctx.fillText(up[u.id], cx + 11, cyc + 16);
      }
      cx += 31;
    }

    // wave indicator with a progress bar
    {
      const total = Math.max(1, waveTotal), left = (waveTotal - waveSpawned) + enemies.length;
      const prog = wavePhase === 'clear' ? 1 : Math.max(0, Math.min(1, 1 - left / total));
      const rx = W - bx;
      spaced(2);
      tag('WAVE ' + wave, rx, cyc - 2, 'right', 14, '#9ff5e4');
      spaced(0);
      tag(wavePhase === 'clear' ? 'CLEAR' : '残り ' + left, rx, cyc + 14, 'right', 11, wavePhase === 'clear' ? '#6fffd0' : '#9fb8d0');
      const wbw = 110;
      ctx.fillStyle = 'rgba(8,16,28,0.7)'; ctx.fillRect(rx - wbw, cyc + 19, wbw, 4);
      ctx.fillStyle = wavePhase === 'clear' ? '#6fffd0' : '#6fe8d4'; ctx.fillRect(rx - wbw, cyc + 19, wbw * prog, 4);
    }

    // the last few enemies of a wave are pointed out at the screen edge
    if (wavePhase === 'spawn' && waveSpawned >= waveTotal && enemies.length > 0 && enemies.length <= 3) {
      for (const e of enemies) {
        const sx = e.x - camL, sy = e.y - camT;
        if (sx > 16 && sx < W - 16 && sy > 16 && sy < H - 16) continue;
        const a = Math.atan2(sy - H / 2, sx - W / 2);
        const kx = Math.max(30, Math.min(W - 30, W / 2 + Math.cos(a) * 1e4));
        const ky = Math.max(120, Math.min(H - 30, H / 2 + Math.sin(a) * 1e4));
        ctx.save(); ctx.translate(kx, ky); ctx.rotate(a);
        ctx.fillStyle = 'rgba(255,90,140,0.9)';
        ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-7, -8); ctx.lineTo(-2, 0); ctx.lineTo(-7, 8); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    // wave banner
    if (waveBannerT > 0) {
      const al = Math.min(1, waveBannerT * 2.5, (2.4 - Math.min(waveBannerT, 2.4)) * 4 + 0.001);
      ctx.globalAlpha = Math.max(0, Math.min(1, al));
      const cy = Math.max(H * 0.3, 210), clear = wavePhase === 'clear';
      const col = clear ? '111,255,208' : '111,232,212';
      ctx.fillStyle = 'rgba(20,70,60,0.5)'; ctx.fillRect(0, cy - 34, W, 70);
      ctx.fillStyle = `rgba(${col},0.85)`; ctx.fillRect(0, cy - 34, W, 1.5); ctx.fillRect(0, cy + 35, W, 1.5);
      ctx.textAlign = 'center';
      spaced(6);
      ctx.font = `900 28px ${FONT}`; ctx.fillStyle = `rgb(${col})`;
      ctx.save(); ctx.shadowColor = `rgb(${col})`; ctx.shadowBlur = 14;
      ctx.fillText(waveBannerText, W / 2 + 3, cy + 6);
      ctx.restore();
      spaced(1);
      ctx.font = `13px ${FONT}`; ctx.fillStyle = '#b8d8e0';
      ctx.fillText(waveBannerSub, W / 2, cy + 27);
      spaced(0);
      ctx.globalAlpha = 1;
    }

    // boss: a thin chamfered bar
    const boss = enemies.find(e => e.boss);
    if (boss) {
      const w2 = Math.min(W - 28, 380), x0 = (W - w2) / 2, y0 = cyc + 44;
      spaced(3);
      tag('BOSS　' + BOSS_TYPE.name, W / 2, y0 - 6, 'center', 12, '#ffb0dc');
      spaced(0);
      chamfer(ctx, x0, y0, w2, 10, 5); ctx.fillStyle = 'rgba(30,6,24,0.8)'; ctx.fill();
      ctx.save(); chamfer(ctx, x0, y0, w2, 10, 5); ctx.clip();
      ctx.fillStyle = lg(ctx, x0, 0, x0 + w2, 0, [[0, '#ff4fa3'], [1, '#a02a7a']]);
      ctx.fillRect(x0, y0, w2 * Math.max(0, boss.hp / boss.maxHp), 10);
      ctx.restore();
      chamfer(ctx, x0, y0, w2, 10, 5); ctx.strokeStyle = 'rgba(255,170,220,0.7)'; ctx.lineWidth = 1.2; ctx.stroke();
    }

    // arrow towards an off-screen treasure chest
    for (const c of chests) {
      const sx = c.x - camL, sy = c.y - camT;
      if (sx > 20 && sx < W - 20 && sy > 20 && sy < H - 20) continue;
      const a = Math.atan2(sy - H / 2, sx - W / 2);
      const kx = Math.max(34, Math.min(W - 34, W / 2 + Math.cos(a) * 1e4));
      const ky = Math.max(100, Math.min(H - 34, H / 2 + Math.sin(a) * 1e4));
      ctx.save(); ctx.translate(kx, ky); ctx.rotate(a);
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rg(ctx, 0, 0, 0, 0, 0, 22, [[0, 'rgba(255,190,90,0.6)'], [1, 'rgba(255,190,90,0)']]);
      ctx.fillRect(-22, -22, 44, 44);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ffc65a';
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-3, 0); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // boss warning banner
    if (bannerT > 0) {
      const al = Math.min(1, bannerT * 2) * (0.75 + 0.25 * Math.sin(clock * 14));
      ctx.globalAlpha = al;
      const cy = H * 0.3;
      ctx.fillStyle = 'rgba(40,0,24,0.55)'; ctx.fillRect(0, cy - 40, W, 84);
      ctx.fillStyle = 'rgba(255,79,163,0.9)'; ctx.fillRect(0, cy - 40, W, 2); ctx.fillRect(0, cy + 42, W, 2);
      ctx.textAlign = 'center';
      spaced(8);
      ctx.font = `900 34px ${FONT}`; ctx.fillStyle = '#ff6ab4';
      ctx.fillText('WARNING', W / 2 + 4, cy + 8);
      spaced(2);
      ctx.font = `bold 14px ${FONT}`; ctx.fillStyle = '#ffe0f0';
      ctx.fillText('月が喰われる。ボスが現れた', W / 2, cy + 32);
      spaced(0);
      ctx.globalAlpha = 1;
    }
  }

  function drawStick() {
    if (!stick.active) return;
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    const d = Math.hypot(dx, dy) || 1;
    const m = Math.min(d, STICK_RADIUS);
    const kx = stick.ox + dx / d * m, ky = stick.oy + dy / d * m;
    hexPath(ctx, stick.ox, stick.oy, STICK_RADIUS);
    ctx.fillStyle = 'rgba(120,220,255,0.07)'; ctx.fill();
    ctx.strokeStyle = 'rgba(150,230,255,0.45)'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rg(ctx, kx, ky, 0, kx, ky, 34, [[0, 'rgba(120,240,230,0.55)'], [1, 'rgba(120,240,230,0)']]);
    ctx.fillRect(kx - 34, ky - 34, 68, 68);
    ctx.restore();
    hexPath(ctx, kx, ky, 20);
    ctx.fillStyle = 'rgba(200,250,245,0.35)'; ctx.fill();
    ctx.strokeStyle = 'rgba(210,255,250,0.85)'; ctx.lineWidth = 1.6; ctx.stroke();
  }

  // ---- level-up screen ----
  function layoutCards() {
    const cw = Math.min(W - 32, 420);
    const ch = Math.max(66, Math.min(96, (H - 190) / 3 - 12));
    const total = 3 * ch + 24;
    const y0 = Math.max(120, (H - total) / 2 + 36);
    return choices.map((c, i) => ({ x: (W - cw) / 2, y: y0 + i * (ch + 12), w: cw, h: ch }));
  }
  function tapCards(px, py) {
    const rects = layoutCards();
    for (let i = 0; i < rects.length; i++) {
      const r = rects[i];
      if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) { chooseUpgrade(i); return; }
    }
  }
  function drawLevelUp() {
    const awaken = mode === 'awaken';
    const accent = awaken ? '#ffc65a' : '#6fe8d4';
    // dim the night further and pull focus to the centre
    ctx.fillStyle = 'rgba(18,34,58,0.6)';
    ctx.fillRect(0, 0, W, H);
    const vg = ctx.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, Math.max(W, H) * 0.7);
    vg.addColorStop(0, awaken ? 'rgba(255,190,90,0.14)' : 'rgba(90,230,210,0.12)');
    vg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    const rects = layoutCards();
    const ty = Math.max(80, rects[0].y - 64);
    ctx.textAlign = 'center';
    spaced(awaken ? 7 : 9);
    ctx.font = `900 ${awaken ? 30 : 34}px ${FONT}`;
    ctx.fillStyle = accent;
    ctx.save(); ctx.shadowColor = accent; ctx.shadowBlur = 18;
    ctx.fillText(awaken ? 'AWAKENING' : 'LEVEL UP', W / 2 + 4, ty);
    ctx.restore();
    spaced(0);
    // thin rules either side of the sub-title
    ctx.strokeStyle = accent; ctx.globalAlpha = 0.5; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W / 2 - 150, ty + 18); ctx.lineTo(W / 2 - 40, ty + 18); ctx.moveTo(W / 2 + 40, ty + 18); ctx.lineTo(W / 2 + 150, ty + 18); ctx.stroke();
    ctx.globalAlpha = 1;
    hexPath(ctx, W / 2, ty + 18, 5); ctx.fillStyle = accent; ctx.fill();
    ctx.font = `13px ${FONT}`; ctx.fillStyle = '#9fb8d0';
    ctx.fillText(awaken ? '宝箱の力で、スキルが真の姿を取り戻す' : `Lv ${level}　強化を1つ選んでください`, W / 2, ty + 44);

    const ready = levelupDelay <= 0;
    choices.forEach((c, i) => {
      const r = rects[i];
      const col = awaken ? '#ffc65a' : c.color;
      ctx.globalAlpha = ready ? 1 : 0.5;
      chamfer(ctx, r.x, r.y, r.w, r.h, 14);
      ctx.fillStyle = lg(ctx, r.x, r.y, r.x + r.w, r.y + r.h, [[0, 'rgba(14,24,40,0.96)'], [1, 'rgba(6,12,24,0.96)']]);
      ctx.fill();
      ctx.strokeStyle = lg(ctx, r.x, r.y, r.x + r.w, r.y, [[0, col], [1, 'rgba(160,215,255,0.18)']]);
      ctx.lineWidth = 1.6; ctx.stroke();
      // left accent bar
      ctx.fillStyle = col; ctx.fillRect(r.x, r.y + 14, 3, r.h - 14);
      // hexagon icon
      const ir = Math.min(27, r.h * 0.34), ix = r.x + 22 + ir, iy = r.y + r.h / 2;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rg(ctx, ix, iy, 0, ix, iy, ir * 2, [[0, col + '66'], [1, col + '00']]);
      ctx.fillRect(ix - ir * 2, iy - ir * 2, ir * 4, ir * 4);
      ctx.restore();
      hexPath(ctx, ix, iy, ir);
      ctx.fillStyle = '#0a1220'; ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
      if (awaken) { hexPath(ctx, ix, iy, ir - 5); ctx.strokeStyle = 'rgba(255,198,90,0.55)'; ctx.lineWidth = 1; ctx.stroke(); }
      drawSkillIcon(ctx, c.id, ix, iy, ir * 0.62, col);
      // text
      const tx = ix + ir + 18;
      ctx.textAlign = 'left';
      ctx.font = `bold 17px ${FONT}`;
      ctx.fillStyle = '#f2f8ff';
      ctx.fillText(awaken ? c.aname : c.name, tx, r.y + r.h / 2 - 5);
      ctx.font = `12.5px ${FONT}`;
      ctx.fillStyle = '#9fb8d0';
      const dtxt = awaken ? c.adesc : (up[c.id] === 0 && c.ndesc ? c.ndesc : c.desc);
      let fs = 12.5;
      while (fs > 9 && (ctx.font = `${fs}px ${FONT}`, ctx.measureText(dtxt).width > r.x + r.w - 16 - tx)) fs -= 0.5;
      ctx.fillText(dtxt, tx, r.y + r.h / 2 + 16);
      // level tag
      ctx.textAlign = 'right';
      spaced(1);
      ctx.font = `bold 11px ${FONT}`;
      ctx.fillStyle = col;
      ctx.fillText(awaken ? 'MAX → 覚醒' : (up[c.id] === 0 && c.ndesc ? 'NEW' : `Lv ${up[c.id]} → ${up[c.id] + 1}`), r.x + r.w - 18, r.y + 22);
      spaced(0);
      if (W > 560) {
        ctx.fillStyle = 'rgba(200,225,255,0.4)';
        ctx.fillText(`[${i + 1}]`, r.x + r.w - 18, r.y + r.h - 12);
      }
      ctx.globalAlpha = 1;
    });
    ctx.textAlign = 'left';
  }

  function drawGameOver() {
    const k = Math.min(1, deadT / 0.6);
    ctx.fillStyle = `rgba(48,14,30,${0.62 * k})`;
    ctx.fillRect(0, 0, W, H);
    const vg = ctx.createRadialGradient(W / 2, H * 0.4, 0, W / 2, H * 0.4, Math.max(W, H) * 0.7);
    vg.addColorStop(0, `rgba(255,60,110,${0.16 * k})`); vg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = k;
    const cy = Math.max(150, H * 0.28);
    ctx.textAlign = 'center';
    spaced(8);
    ctx.font = `900 36px ${FONT}`;
    ctx.fillStyle = '#ff5a8a';
    ctx.save(); ctx.shadowColor = '#ff2a6a'; ctx.shadowBlur = 20;
    ctx.fillText('GAME OVER', W / 2 + 4, cy);
    ctx.restore();
    spaced(1);
    ctx.font = `13px ${FONT}`; ctx.fillStyle = '#b894a8';
    ctx.fillText('月に喰われてしまった', W / 2, cy + 28);
    spaced(0);

    let best = { time: 0, kills: 0 };
    try { best = JSON.parse(localStorage.getItem('hollownight.best') || 'null') || best; } catch (e) { /* ignore */ }
    const t = Math.floor(time), fmt = n => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
    const rows = [['到達ウェーブ', 'WAVE ' + wave, 'BEST ' + (best.wave || wave)], ['生存時間', fmt(t), 'BEST ' + fmt(best.time)], ['撃破数', String(kills), 'BEST ' + best.kills], ['到達レベル', 'Lv ' + level, '']];
    const pw = Math.min(W - 40, 340), px = (W - pw) / 2, py = cy + 54, rh = 46;
    chamfer(ctx, px, py, pw, rh * rows.length + 16, 14);
    ctx.fillStyle = 'rgba(14,20,36,0.92)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,90,140,0.7)'; ctx.lineWidth = 1.4; ctx.stroke();
    rows.forEach((r, i) => {
      const y = py + 16 + i * rh + 24;
      ctx.textAlign = 'left'; ctx.font = `13px ${FONT}`; ctx.fillStyle = '#9fb8d0';
      ctx.fillText(r[0], px + 20, y);
      ctx.textAlign = 'right'; ctx.font = `800 22px ${FONT}`; ctx.fillStyle = '#f2f8ff';
      ctx.fillText(r[1], px + pw - 20, y);
      if (r[2]) { ctx.font = `10px ${FONT}`; ctx.fillStyle = '#6f8ba4'; ctx.fillText(r[2], px + pw - 20, y + 15); }
    });

    // retry button
    const bw = Math.min(W - 60, 240), bh = 52, bx = (W - bw) / 2, by = py + rh * rows.length + 46;
    const ready = deadT > 0.9, pulse = ready ? 0.7 + 0.3 * Math.sin(clock * 5) : 0.3;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rg(ctx, W / 2, by + bh / 2, 0, W / 2, by + bh / 2, bw * 0.7, [[0, `rgba(90,230,210,${0.2 * pulse})`], [1, 'rgba(90,230,210,0)']]);
    ctx.fillRect(bx - 40, by - 40, bw + 80, bh + 80);
    ctx.restore();
    chamfer(ctx, bx, by, bw, bh, 12);
    ctx.fillStyle = 'rgba(10,28,34,0.95)'; ctx.fill();
    ctx.strokeStyle = `rgba(111,232,212,${pulse})`; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = 'center'; spaced(4);
    ctx.font = `bold 18px ${FONT}`; ctx.fillStyle = ready ? '#8ff5e2' : '#4a6a70';
    ctx.fillText('もう一度', W / 2 + 2, by + 32);
    spaced(0);
    if (W > 560) { ctx.font = `11px ${FONT}`; ctx.fillStyle = '#6f8ba4'; ctx.fillText('[R] / [Enter]', W / 2, by + bh + 22); }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    camL = Math.round(cam.x - W / 2 + (Math.random() - 0.5) * shake);
    camT = Math.round(cam.y - H / 2 + (Math.random() - 0.5) * shake);
    drawGround();
    drawWorld();
    drawEffects();
    drawAmbient();
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
    // danger and hit flashes around the screen edge
    const hf = hp / S.maxHp;
    const da = Math.max(hitFlash * 0.9, hf < 0.3 && state !== 'dead' ? 0.2 + 0.12 * Math.sin(clock * 6) : 0);
    if (da > 0) {
      const r = Math.hypot(W, H) / 2;
      const dg = ctx.createRadialGradient(W / 2, H / 2, r * 0.45, W / 2, H / 2, r);
      dg.addColorStop(0, 'rgba(255,30,70,0)'); dg.addColorStop(1, `rgba(255,30,70,${da})`);
      ctx.fillStyle = dg; ctx.fillRect(0, 0, W, H);
    }
    drawHud();
    drawStick();
    ctx.font = `10px ${FONT}`; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillText('build ' + BUILD, 8, H - 8);
    if (state === 'levelup') drawLevelUp();
    if (state === 'dead') drawGameOver();
  }

  startWave(Number(params.get('w')) || 1);

  // debug hooks for testing
  window.__dbg = {
    addXp, spawnBoss, choose: chooseUpgrade,
    spawnNear: n => { for (let i = 0; i < n; i++) spawnEnemy(true); },
    setUp: (id, n) => { up[id] = n; recalc(); },
    giveChest: () => { pendingAwaken++; if (state === 'playing') nextScreen(); },
    dropChest: () => chests.push({ x: player.x + 200, y: player.y + 40, ph: 0 }),
    awaken: id => { aw[id] = true; recalc(); },
    damage: n => { hp -= n; if (hp <= 0) { if (aw.vit && !revived) { revived = true; hp = S.maxHp; invuln = 2.5; shockwave(); } else { hp = 0; gameOver(); } } },
    reset: resetGame,
    timing: () => { const t0 = performance.now(); for (let i = 0; i < 60; i++) update(1 / 60); const t1 = performance.now(); for (let i = 0; i < 60; i++) render(); const t2 = performance.now(); const parts = {}; for (const [n, f] of [['ground', drawGround], ['world', drawWorld], ['effects', drawEffects], ['ambient', drawAmbient], ['hud', drawHud]]) { const a = performance.now(); for (let i = 0; i < 60; i++) f(); parts[n] = +((performance.now() - a) / 60).toFixed(2); } return { updateMs: +((t1 - t0) / 60).toFixed(2), renderMs: +((t2 - t1) / 60).toFixed(2), parts }; },
    sim: (o = {}) => { // headless bot for balance testing
      resetGame();
      if (o.up) for (const k in o.up) up[k] = o.up[k];
      if (o.aw) for (const k of o.aw) aw[k] = true;
      recalc(); hp = S.maxHp;
      const dt = 1 / 60, limit = (o.seconds || 600) * 60;
      let steps = 0, hits = 0, minHp = hp, lastW = wave; const wtimes = [];
      while (steps < limit && state !== 'dead') {
        if (state === 'levelup') {
          levelupDelay = 0;
          const pick = o.pick ? o.pick(choices) : Math.floor(Math.random() * choices.length);
          chooseUpgrade(pick);
          continue;
        }
        keys.clear();
        let vx = 0, vy = 0, near = null, nd = 1e12;
        for (const e of enemies) {
          const dx = player.x - e.x, dy = player.y - e.y, d2 = dx * dx + dy * dy;
          if (d2 < nd) { nd = d2; near = e; }
          if (d2 < (o.flee || 120) ** 2) { const w = 1 / (d2 + 300); vx += dx * w; vy += dy * w; }
        }
        const flee = Math.hypot(vx, vy) > 1e-4;
        if (!flee) {
          let bg = null, bd = 380 * 380;
          for (const g of gems) { const d = (g.x - player.x) ** 2 + (g.y - player.y) ** 2; if (d < bd) { bd = d; bg = g; } }
          for (const c of chests) { bg = c; break; }
          if (bg) { const dx = bg.x - player.x, dy = bg.y - player.y, d = Math.hypot(dx, dy) || 1; vx += dx / d * 0.01; vy += dy / d * 0.01; }
          else if (near && nd > 170 * 170) { const dx = near.x - player.x, dy = near.y - player.y, d = Math.hypot(dx, dy) || 1; vx += dx / d * 0.01; vy += dy / d * 0.01; }
        }
        if (vx > 0.0006) keys.add('d'); else if (vx < -0.0006) keys.add('a');
        if (vy > 0.0006) keys.add('s'); else if (vy < -0.0006) keys.add('w');
        const h0 = hp;
        update(dt); steps++;
        if (wave !== lastW) { wtimes.push(+time.toFixed(1)); lastW = wave; }
        if (hp < h0 - 1) hits++;
        minHp = Math.min(minHp, hp);
      }
      keys.clear();
      return { wtimes: wtimes.join(','), dead: state === 'dead', wave, time: Math.round(time), level, kills, hits, minHp: Math.round(minHp), up: JSON.stringify(up), aw: Object.keys(aw).filter(k => aw[k]).join(',') };
    },
    iconSheet: (x, c) => { UPGRADES.forEach((u, i) => { const px = 50 + (i % 6) * 100, py = 50 + Math.floor(i / 6) * 100; hexPath(x, px, py, 38); x.fillStyle = '#0a1220'; x.fill(); x.strokeStyle = u.color; x.lineWidth = 2; x.stroke(); drawSkillIcon(x, u.id, px, py, 24, u.color); }); return c.toDataURL('image/png'); },
    heroSheet: (x, c) => { for (let i = 0; i < 4; i++) x.drawImage(playerFrames[i], 10 + i * 220, 10, PW * 3.4, PH * 3.4); return c.toDataURL('image/png'); },
    sheet: () => { const T = ENEMY_TYPES.concat([BOSS_TYPE]); const c = document.createElement('canvas'); c.width = 1200; c.height = 780; const x = c.getContext('2d'); x.fillStyle = '#5bab52'; x.fillRect(0, 0, 1200, 780); x.drawImage(playerFrames[1], 10, 10, PW * 3, PH * 3); let px = 220, py = 10; for (const t of T) { if (t.boss) continue; const w = t.w * 2, h = t.h * 2; if (px + w > 1190) { px = 220; py += 200; } x.drawImage(t.spr[0], px, py, w, h); px += w + 6; } x.drawImage(BOSS_TYPE.spr[0], 10, 280, 320, 320); return c.toDataURL('image/png'); },
    dropMagnet: () => magnets.push({ x: player.x + 120, y: player.y + 30, ph: 0 }),
    dropGems: n => { for (let i = 0; i < n; i++) gems.push({ x: player.x + (Math.random() - 0.5) * 800, y: player.y + (Math.random() - 0.5) * 1000, v: [1, 2, 5][i % 3], ph: Math.random() * TAU, s: 0, mag: false }); },
    killAll: () => { waveSpawned = waveTotal; enemies.forEach(e => { e.hp = 0; }); },
    get wave() { return wave; },
    get phase() { return wavePhase; },
    get hp() { return hp; },
    laserPts: () => lasers.map(l => l.pts && l.pts.map(p => p.map(Math.round))),
    laserTg: () => lasers.map(l => enemies.indexOf(l.tg)),
    get enemyCount() { return enemies.length; },
    get state() { return state; },
  };

  // =====================================================================
  // Loop
  // =====================================================================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
