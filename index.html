<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Survivor Game</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  // ---------- Input: keyboard ----------
  const keys = new Set();
  const MOVE_KEYS = ['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'];
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (MOVE_KEYS.includes(k)) { keys.add(k); e.preventDefault(); }
  });
  window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => keys.clear());

  // ---------- Input: virtual stick (floating, appears where touched) ----------
  const STICK_RADIUS = 60;
  const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };

  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || stick.active) return;
    stick.active = true;
    stick.id = e.pointerId;
    stick.ox = stick.x = e.clientX;
    stick.oy = stick.y = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!stick.active || e.pointerId !== stick.id) return;
    stick.x = e.clientX;
    stick.y = e.clientY;
  });
  const endStick = e => {
    if (e.pointerId === stick.id) { stick.active = false; stick.id = null; }
  };
  canvas.addEventListener('pointerup', endStick);
  canvas.addEventListener('pointercancel', endStick);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  function getInput() {
    let x = 0, y = 0;
    if (keys.has('a') || keys.has('arrowleft')) x -= 1;
    if (keys.has('d') || keys.has('arrowright')) x += 1;
    if (keys.has('w') || keys.has('arrowup')) y -= 1;
    if (keys.has('s') || keys.has('arrowdown')) y += 1;
    if (x || y) {
      const l = Math.hypot(x, y);
      return { x: x / l, y: y / l };
    }
    if (stick.active) {
      const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
      const d = Math.hypot(dx, dy);
      if (d > 4) {
        const m = Math.min(d / STICK_RADIUS, 1);
        return { x: dx / d * m, y: dy / d * m };
      }
    }
    return { x: 0, y: 0 };
  }

  // ---------- World ----------
  const player = { x: 0, y: 0, r: 14, speed: 220 };
  const cam = { x: 0, y: 0 };
  const GRID = 64;

  function update(dt) {
    const v = getInput();
    player.x += v.x * player.speed * dt;
    player.y += v.y * player.speed * dt;
    // player always stays at screen center; camera follows
    cam.x = player.x;
    cam.y = player.y;
  }

  function drawGrid() {
    const left = cam.x - W / 2, top = cam.y - H / 2;
    const startX = Math.floor(left / GRID) * GRID;
    const startY = Math.floor(top / GRID) * GRID;
    ctx.strokeStyle = '#2a2f3a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = startX; x <= left + W + GRID; x += GRID) {
      const sx = Math.round(x - left) + 0.5;
      ctx.moveTo(sx, 0); ctx.lineTo(sx, H);
    }
    for (let y = startY; y <= top + H + GRID; y += GRID) {
      const sy = Math.round(y - top) + 0.5;
      ctx.moveTo(0, sy); ctx.lineTo(W, sy);
    }
    ctx.stroke();
  }

  function drawPlayer() {
    const cx = W / 2, cy = H / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + player.r * 0.9, player.r * 0.9, player.r * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4fc3f7';
    ctx.strokeStyle = '#e1f5fe';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, player.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  function drawStick() {
    if (!stick.active) return;
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    const d = Math.hypot(dx, dy) || 1;
    const m = Math.min(d, STICK_RADIUS);
    const kx = stick.ox + dx / d * m, ky = stick.oy + dy / d * m;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(stick.ox, stick.oy, STICK_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.arc(kx, ky, 26, 0, Math.PI * 2);
    ctx.fill();
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#1a1d24';
    ctx.fillRect(0, 0, W, H);
    drawGrid();
    drawPlayer();
    drawStick();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
