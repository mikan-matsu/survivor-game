<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Survivor Game</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #2f5d3a;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  // ---------- Input: keyboard ----------
  const keys = new Set();
  const MOVE_KEYS = ['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'];
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (MOVE_KEYS.includes(k)) { keys.add(k); e.preventDefault(); }
  });
  window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  window.addEventListener('blur', () => keys.clear());

  // ---------- Input: virtual stick (floating, appears where touched) ----------
  const STICK_RADIUS = 60;
  const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };

  canvas.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || stick.active) return;
    stick.active = true;
    stick.id = e.pointerId;
    stick.ox = stick.x = e.clientX;
    stick.oy = stick.y = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (!stick.active || e.pointerId !== stick.id) return;
    stick.x = e.clientX;
    stick.y = e.clientY;
  });
  const endStick = e => {
    if (e.pointerId === stick.id) { stick.active = false; stick.id = null; }
  };
  canvas.addEventListener('pointerup', endStick);
  canvas.addEventListener('pointercancel', endStick);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  function getInput() {
    let x = 0, y = 0;
    if (keys.has('a') || keys.has('arrowleft')) x -= 1;
    if (keys.has('d') || keys.has('arrowright')) x += 1;
    if (keys.has('w') || keys.has('arrowup')) y -= 1;
    if (keys.has('s') || keys.has('arrowdown')) y += 1;
    if (x || y) {
      const l = Math.hypot(x, y);
      return { x: x / l, y: y / l };
    }
    if (stick.active) {
      const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
      const d = Math.hypot(dx, dy);
      if (d > 4) {
        const m = Math.min(d / STICK_RADIUS, 1);
        return { x: dx / d * m, y: dy / d * m };
      }
    }
    return { x: 0, y: 0 };
  }

  // ---------- World ----------
  const player = { x: 0, y: 0, r: 14, speed: 220, face: 1, walk: 0 };
  const cam = { x: 0, y: 0 };
  const TILE = 64;
  let time = 0;

  // deterministic hash -> [0,1)
  function hash(x, y, s) {
    let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // ---------- Enemies ----------
  const ENEMY_TYPES = [
    { name: 'slime', r: 12, speed: 55, hp: 20, color: '#7bd36b', dark: '#3f8f43' },
    { name: 'bat',   r: 10, speed: 95, hp: 12, color: '#9b6bd6', dark: '#5a3a8c' },
    { name: 'ghoul', r: 15, speed: 70, hp: 50, color: '#d6735f', dark: '#8c3b2e' },
  ];
  const enemies = [];
  const MAX_ENEMIES = 120;
  let spawnTimer = 0;

  function spawnEnemy() {
    if (enemies.length >= MAX_ENEMIES) return;
    const ang = Math.random() * Math.PI * 2;
    const dist = Math.hypot(W, H) / 2 + 60;
    const roll = Math.random();
    const t = roll < 0.6 ? ENEMY_TYPES[0] : roll < 0.85 ? ENEMY_TYPES[1] : ENEMY_TYPES[2];
    enemies.push({
      t, x: player.x + Math.cos(ang) * dist, y: player.y + Math.sin(ang) * dist,
      phase: Math.random() * 6.28, face: 1, hp: t.hp, flash: 0,
    });
  }

  function updateEnemies(dt) {
    spawnTimer -= dt;
    // spawn gets faster over time
    const interval = Math.max(0.25, 1.2 - time * 0.01);
    while (spawnTimer <= 0) { spawnEnemy(); spawnTimer += interval; }

    for (const e of enemies) {
      e.flash = Math.max(0, e.flash - dt);
      const dx = player.x - e.x, dy = player.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      e.x += dx / d * e.t.speed * dt;
      e.y += dy / d * e.t.speed * dt;
      if (Math.abs(dx) > 2) e.face = dx > 0 ? 1 : -1;
    }
    // soft separation so enemies do not stack into one blob
    for (let i = 0; i < enemies.length; i++) {
      const a = enemies[i];
      for (let j = i + 1; j < enemies.length; j++) {
        const b = enemies[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const min = a.t.r + b.t.r;
        if (Math.abs(dx) > min || Math.abs(dy) > min) continue;
        const d = Math.hypot(dx, dy);
        if (d > 0 && d < min) {
          const push = (min - d) / 2 / d;
          a.x -= dx * push; a.y -= dy * push;
          b.x += dx * push; b.y += dy * push;
        }
      }
    }
    // despawn enemies that got left far behind
    const far = Math.hypot(W, H) + 400;
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y) > far) enemies.splice(i, 1);
    }
  }

  // ---------- Auto attack: magic bolts ----------
  const weapon = { cooldown: 0.7, timer: 0, range: 380, speed: 440, damage: 10, life: 1.4, r: 6 };
  const bolts = [];
  const particles = [];
  const popups = [];
  let kills = 0;

  function nearestEnemy(maxDist) {
    let best = null, bd = maxDist * maxDist;
    for (const e of enemies) {
      const d = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  function updateWeapon(dt) {
    weapon.timer -= dt;
    if (weapon.timer <= 0) {
      const target = nearestEnemy(weapon.range);
      if (target) {
        const dx = target.x - player.x, dy = target.y - player.y;
        const d = Math.hypot(dx, dy) || 1;
        bolts.push({ x: player.x, y: player.y - 8, vx: dx / d * weapon.speed, vy: dy / d * weapon.speed, life: weapon.life });
        weapon.timer = weapon.cooldown;
      } else {
        weapon.timer = 0.1; // keep checking until something is in range
      }
    }
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      let hit = null;
      for (const e of enemies) {
        const rr = e.t.r + weapon.r;
        if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < rr * rr) { hit = e; break; }
      }
      if (hit) {
        hitEnemy(hit, weapon.damage, b.vx, b.vy);
        bolts.splice(i, 1);
      } else if (b.life <= 0) {
        bolts.splice(i, 1);
      }
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.hp <= 0) {
        kills++;
        burst(e.x, e.y, e.t.color);
        enemies.splice(i, 1);
      }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      p.vx *= 0.92; p.vy *= 0.92;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].y -= 30 * dt; popups[i].life -= dt;
      if (popups[i].life <= 0) popups.splice(i, 1);
    }
  }

  function hitEnemy(e, dmg, vx, vy) {
    e.hp -= dmg;
    e.flash = 0.08;
    const d = Math.hypot(vx, vy) || 1;
    e.x += vx / d * 8; e.y += vy / d * 8; // small knockback
    popups.push({ x: e.x, y: e.y - e.t.r - 6, text: String(dmg), life: 0.5 });
    burst(e.x, e.y, '#fff', 3);
  }

  function burst(x, y, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, sp = 60 + Math.random() * 120;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.3 + Math.random() * 0.3, color });
    }
  }

  function drawEffects() {
    const left = cam.x - W / 2, top = cam.y - H / 2;
    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life * 3);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - left - 2, p.y - top - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    for (const b of bolts) {
      const sx = b.x - left, sy = b.y - top;
      const g = ctx.createRadialGradient(sx, sy, 1, sx, sy, 16);
      g.addColorStop(0, 'rgba(255,220,120,0.9)');
      g.addColorStop(1, 'rgba(255,140,30,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(sx, sy, 16, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#fff4c2';
      ctx.beginPath(); ctx.arc(sx, sy, weapon.r - 1, 0, 6.283); ctx.fill();
      ctx.fillStyle = '#ff9a1f';
      ctx.beginPath(); ctx.arc(sx - b.vx * 0.015, sy - b.vy * 0.015, weapon.r - 2.5, 0, 6.283); ctx.fill();
    }
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.fillStyle = '#fff';
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life * 4);
      ctx.strokeText(p.text, p.x - left, p.y - top);
      ctx.fillText(p.text, p.x - left, p.y - top);
    }
    ctx.globalAlpha = 1;
  }

  function drawHud() {
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)';
    ctx.fillStyle = '#fff';
    const y = 28 + (parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0);
    ctx.strokeText('撃破 ' + kills, 16, y);
    ctx.fillText('撃破 ' + kills, 16, y);
  }

  function update(dt) {
    time += dt;
    const v = getInput();
    player.x += v.x * player.speed * dt;
    player.y += v.y * player.speed * dt;
    if (v.x > 0.1) player.face = 1; else if (v.x < -0.1) player.face = -1;
    player.walk = (v.x || v.y) ? player.walk + dt * 12 : 0;
    cam.x = player.x;
    cam.y = player.y;
    updateEnemies(dt);
    updateWeapon(dt);
  }

  // ---------- Background: procedural grass field ----------
  const GRASS = ['#2f5d3a', '#336640', '#2c5836', '#386b44'];
  function drawBackground() {
    const left = cam.x - W / 2, top = cam.y - H / 2;
    const tx0 = Math.floor(left / TILE), ty0 = Math.floor(top / TILE);
    const tx1 = Math.floor((left + W) / TILE), ty1 = Math.floor((top + H) / TILE);
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {
        const sx = Math.round(tx * TILE - left), sy = Math.round(ty * TILE - top);
        ctx.fillStyle = GRASS[Math.floor(hash(tx, ty, 1) * GRASS.length)];
        ctx.fillRect(sx, sy, TILE + 1, TILE + 1);
        // darker patches
        if (hash(tx, ty, 2) < 0.18) {
          ctx.fillStyle = 'rgba(10,40,25,0.22)';
          ctx.beginPath();
          ctx.ellipse(sx + 16 + hash(tx, ty, 3) * 32, sy + 16 + hash(tx, ty, 4) * 32,
            18 + hash(tx, ty, 5) * 14, 12 + hash(tx, ty, 6) * 10, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        // grass tufts
        const n = 2 + Math.floor(hash(tx, ty, 7) * 3);
        ctx.strokeStyle = 'rgba(150,215,130,0.55)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const gx = sx + hash(tx, ty, 10 + i) * (TILE - 8) + 4;
          const gy = sy + hash(tx, ty, 20 + i) * (TILE - 8) + 6;
          ctx.moveTo(gx - 3, gy); ctx.lineTo(gx - 4, gy - 6);
          ctx.moveTo(gx, gy); ctx.lineTo(gx, gy - 8);
          ctx.moveTo(gx + 3, gy); ctx.lineTo(gx + 4, gy - 6);
        }
        ctx.stroke();
        // flowers and stones
        const r = hash(tx, ty, 30);
        const px = sx + 10 + hash(tx, ty, 31) * (TILE - 20);
        const py = sy + 10 + hash(tx, ty, 32) * (TILE - 20);
        if (r < 0.12) {
          ctx.fillStyle = ['#f5e56b', '#f08fb0', '#ffffff', '#9ec5ff'][Math.floor(hash(tx, ty, 33) * 4)];
          for (let k = 0; k < 4; k++) {
            const a = k * Math.PI / 2;
            ctx.beginPath();
            ctx.arc(px + Math.cos(a) * 3, py + Math.sin(a) * 3, 2.2, 0, 6.3);
            ctx.fill();
          }
          ctx.fillStyle = '#e8a53a';
          ctx.beginPath(); ctx.arc(px, py, 1.8, 0, 6.3); ctx.fill();
        } else if (r < 0.19) {
          ctx.fillStyle = 'rgba(0,0,0,0.25)';
          ctx.beginPath(); ctx.ellipse(px + 1, py + 4, 9, 4, 0, 0, 6.3); ctx.fill();
          ctx.fillStyle = '#8a8f98';
          ctx.beginPath(); ctx.ellipse(px, py, 8, 6, 0, 0, 6.3); ctx.fill();
          ctx.fillStyle = '#aab0b8';
          ctx.beginPath(); ctx.ellipse(px - 2, py - 2, 4, 2.5, 0, 0, 6.3); ctx.fill();
        }
      }
    }
  }

  // ---------- Drawing: characters ----------
  function shadow(x, y, rx) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(x, y, rx, rx * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Player: little wizard "Mikan" with an orange hat
  function drawPlayer() {
    const cx = W / 2, cy = H / 2;
    const bob = Math.sin(player.walk) * 2;
    const f = player.face;
    shadow(cx, cy + 16, 13);
    ctx.save();
    ctx.translate(cx, cy + bob);
    ctx.scale(f, 1);
    // cape
    ctx.fillStyle = '#e8702a';
    ctx.beginPath();
    ctx.moveTo(-11, -2); ctx.lineTo(11, -2); ctx.lineTo(13, 15); ctx.lineTo(-13, 15);
    ctx.closePath(); ctx.fill();
    // belt
    ctx.fillStyle = '#7a3b14';
    ctx.fillRect(-11, 5, 22, 3);
    // head
    ctx.fillStyle = '#ffd9b0';
    ctx.beginPath(); ctx.arc(0, -8, 9, 0, Math.PI * 2); ctx.fill();
    // eye
    ctx.fillStyle = '#2a1a10';
    ctx.beginPath(); ctx.arc(4, -8, 1.8, 0, Math.PI * 2); ctx.fill();
    // hat
    ctx.fillStyle = '#f6a21e';
    ctx.beginPath();
    ctx.moveTo(-12, -13); ctx.lineTo(12, -13); ctx.lineTo(3, -34); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#c9780d';
    ctx.fillRect(-12, -15, 24, 4);
    // leaf on hat
    ctx.fillStyle = '#5fbf4a';
    ctx.beginPath(); ctx.ellipse(6, -33, 5, 2.5, -0.6, 0, Math.PI * 2); ctx.fill();
    // feet
    ctx.fillStyle = '#4a2a14';
    const step = Math.sin(player.walk) * 3;
    ctx.fillRect(-8 + step, 14, 6, 4);
    ctx.fillRect(2 - step, 14, 6, 4);
    ctx.restore();
  }

  function drawEnemy(e, sx, sy) {
    const t = e.t;
    const w = Math.sin(time * 6 + e.phase);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(e.face, 1);
    if (t.name === 'slime') {
      shadow(0, t.r * 0.8, t.r);
      const sq = 1 + w * 0.08;
      ctx.fillStyle = t.color;
      ctx.beginPath();
      ctx.ellipse(0, 2, t.r * (2 - sq), t.r * sq * 0.9, 0, Math.PI, 0);
      ctx.lineTo(t.r * (2 - sq), 8); ctx.lineTo(-t.r * (2 - sq), 8);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = t.dark; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-3, -2, 3, 0, 6.3); ctx.arc(5, -2, 3, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(-2, -2, 1.4, 0, 6.3); ctx.arc(6, -2, 1.4, 0, 6.3); ctx.fill();
    } else if (t.name === 'bat') {
      shadow(0, t.r + 8, t.r * 0.9);
      const y = -6 + w * 3;
      const flap = w * 7;
      ctx.fillStyle = t.dark;
      ctx.beginPath();
      ctx.moveTo(-3, y); ctx.lineTo(-17, y - 6 - flap); ctx.lineTo(-11, y + 2); ctx.lineTo(-7, y + 8);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(3, y); ctx.lineTo(17, y - 6 - flap); ctx.lineTo(11, y + 2); ctx.lineTo(7, y + 8);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = t.color;
      ctx.beginPath(); ctx.arc(0, y + 1, 8, 0, 6.3); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6, y - 5); ctx.lineTo(-4, y - 12); ctx.lineTo(-1, y - 6);
      ctx.moveTo(6, y - 5); ctx.lineTo(4, y - 12); ctx.lineTo(1, y - 6); ctx.fill();
      ctx.fillStyle = '#ffe36b';
      ctx.beginPath(); ctx.arc(-3, y, 1.8, 0, 6.3); ctx.arc(3, y, 1.8, 0, 6.3); ctx.fill();
    } else {
      shadow(0, t.r + 2, t.r);
      const y = w * 1.5;
      ctx.fillStyle = t.dark;
      ctx.fillRect(-10, 2 + y, 20, 14);
      ctx.fillStyle = t.color;
      ctx.beginPath(); ctx.arc(0, -3 + y, 12, 0, 6.3); ctx.fill();
      ctx.fillStyle = '#1a0d0d';
      ctx.beginPath(); ctx.arc(-4, -4 + y, 2.6, 0, 6.3); ctx.arc(5, -4 + y, 2.6, 0, 6.3); ctx.fill();
      ctx.fillRect(-4, 3 + y, 9, 2);
      ctx.fillStyle = '#f2ead8';
      ctx.beginPath(); ctx.moveTo(-9, -12 + y); ctx.lineTo(-6, -20 + y); ctx.lineTo(-3, -13 + y); ctx.fill();
      ctx.beginPath(); ctx.moveTo(9, -12 + y); ctx.lineTo(6, -20 + y); ctx.lineTo(3, -13 + y); ctx.fill();
    }
    ctx.restore();
    if (e.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.arc(sx, sy, t.r, 0, 6.283); ctx.fill();
    }
  }

  function drawEnemies() {
    const left = cam.x - W / 2, top = cam.y - H / 2;
    const list = enemies.filter(e => {
      const sx = e.x - left, sy = e.y - top;
      return sx > -40 && sx < W + 40 && sy > -40 && sy < H + 40;
    });
    // draw the player among enemies by y order
    list.sort((a, b) => a.y - b.y);
    let playerDrawn = false;
    for (const e of list) {
      if (!playerDrawn && e.y > player.y) { drawPlayer(); playerDrawn = true; }
      drawEnemy(e, e.x - left, e.y - top);
    }
    if (!playerDrawn) drawPlayer();
  }

  function drawStick() {
    if (!stick.active) return;
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    const d = Math.hypot(dx, dy) || 1;
    const m = Math.min(d, STICK_RADIUS);
    const kx = stick.ox + dx / d * m, ky = stick.oy + dy / d * m;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(stick.ox, stick.oy, STICK_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(kx, ky, 26, 0, Math.PI * 2);
    ctx.fill();
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();
    drawEnemies();
    drawEffects();
    drawHud();
    drawStick();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
